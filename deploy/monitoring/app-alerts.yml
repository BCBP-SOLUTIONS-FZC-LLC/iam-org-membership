# Prometheus alerting rules for the iam-org-membership application.
#
# HTTP request metrics (platform_http_request_duration_seconds,
# platform_http_requests_total) are emitted by platform-gincommon; the
# consumer/outbox platform_* metrics by platform-events. Business event
# counters/gauges (iam_*) are registered in
# internal/adapter/outbound/metrics/business.go and by the four in-process
# exporter goroutines started in cmd/server/main.go (LLD §11.2).
#
# metric_status: proposed — the platform_http_* successors of the removed
# http_* names are still Proposed in the Platform Observability Registry
# (awaiting governance); every alert that queries them carries the label
# metric_status: proposed so routing can treat them accordingly.
#
# Deploy via PrometheusRule CRD (kube-prometheus-stack) or include in a
# Prometheus --rule-files directory. The Helm chart renders an equivalent
# PrometheusRule at deploy/helm/templates/prometheusrule.yaml — this file is
# the source-of-truth "flat" version used by non-kube-prometheus setups.
#
# Labels on all HTTP metrics (from platform-gincommon):
#   domain, service, environment — identity ("iam", "iam-org-membership", APP_ENV)
#   method       — HTTP method (non-standard methods become OTHER)
#   route        — Gin route template (e.g. /api/v1/tenants/:id), or unknown
#   status_class — 2xx | 4xx | 5xx
#   error_class  — success | client_error | server_error
#
# Every alert carries:
#   severity: page | ticket | warning | critical — routes to PagerDuty (page/critical)
#             or Jira (ticket/warning/info)
#   runbook:  path fragment in the ops runbook repo (where present)

groups:
  # ── Availability ────────────────────────────────────────────────────────────
  - name: iam_org_membership_availability
    rules:

      - alert: IAMOrgMembershipDown
        expr: |
          absent(up{job="iam-org-membership"} == 1)
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: iam-org-membership has no healthy instances
          description: >-
            No iam-org-membership pods have been scraped as healthy for 2 minutes.
            Check pod readiness: kubectl get pods -l app.kubernetes.io/name=iam-org-membership
          runbook: "iam-org-membership/service-down"

      - alert: IAMOrgMembershipReplicasMissing
        expr: |
          sum(up{job="iam-org-membership"}) < 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-org-membership running below minimum replica count
          description: >-
            Fewer than 2 replicas are healthy. HPA minReplicas is 2 (LLD §13.1);
            a further disruption will block node drains.
            Current healthy count: {{ $value }}.
          runbook: "iam-org-membership/service-down"

  # ── HTTP error rate ─────────────────────────────────────────────────────────
  - name: iam_org_membership_errors
    rules:

      - alert: IAMOrgMembershipHighErrorRate
        expr: |
          sum by (domain, service, environment) (rate(platform_http_requests_total{job="iam-org-membership", status_class="5xx"}[5m]))
            /
          sum by (domain, service, environment) (rate(platform_http_requests_total{job="iam-org-membership"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
          metric_status: proposed
        annotations:
          summary: iam-org-membership 5xx error rate above 5%
          description: >-
            {{ $value | humanizePercentage }} of requests are returning 5xx errors
            over the last 5 minutes. Investigate recent deployments, dependency
            health (Postgres, Valkey, SNS/SQS, Workflow/UP/RP), and application logs.
          runbook: "iam-org-membership/high-error-rate"

      - alert: IAMOrgMembershipCriticalErrorRate
        expr: |
          sum by (domain, service, environment) (rate(platform_http_requests_total{job="iam-org-membership", status_class="5xx"}[5m]))
            /
          sum by (domain, service, environment) (rate(platform_http_requests_total{job="iam-org-membership"}[5m]))
          > 0.20
        for: 2m
        labels:
          severity: critical
          team: platform
          metric_status: proposed
        annotations:
          summary: iam-org-membership 5xx error rate above 20%
          runbook: "iam-org-membership/critical-error-rate"
          description: >-
            {{ $value | humanizePercentage }} of requests are returning 5xx errors.
            This exceeds the critical threshold. Escalate immediately — the service
            is severely degraded.

  # ── HTTP latency ────────────────────────────────────────────────────────────
  - name: iam_org_membership_latency
    rules:

      # SLO-2 per LLD §11.1 — I-8 hot-path p95 must stay ≤ 30 ms (cache miss).
      # This endpoint is on the critical path for every authenticated request.
      - alert: IAMOrgMembershipI8HotPathLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le, domain, service, environment) (
              rate(platform_http_request_duration_seconds_bucket{
                job="iam-org-membership",
                route="/api/v1/internal/users/:id/memberships"
              }[5m])
            )
          ) > 0.030
        for: 5m
        labels:
          severity: warning
          team: platform
          metric_status: proposed
          slo: SLO-2
        annotations:
          summary: I-8 memberships hot-path p95 above 30 ms
          description: >-
            GET /internal/users/:id/memberships p95 is {{ $value | humanizeDuration }},
            exceeding the 30 ms SLO. This endpoint is hit on every authenticated
            request — check Valkey cache hit rate (om:memberships) and Postgres
            planner for tenant_memberships/dept_memberships joins.
          runbook: "iam-org-membership/i8-latency"

      - alert: IAMOrgMembershipHighLatency
        expr: |
          histogram_quantile(0.99,
            sum by (le, domain, service, environment) (
              rate(platform_http_request_duration_seconds_bucket{job="iam-org-membership"}[5m])
            )
          ) > 2.0
        for: 10m
        labels:
          severity: warning
          team: platform
          metric_status: proposed
        annotations:
          summary: iam-org-membership p99 latency above 2s
          description: >-
            The p99 request duration is {{ $value | humanizeDuration }}, exceeding
            the 2s SLO threshold. The 30s application timeout will not yet be triggered,
            but user-facing latency is degraded. Check slow-query logs
            (PG_SLOW_QUERY_THRESHOLD) and Valkey response times.

      - alert: IAMOrgMembershipCriticalLatency
        expr: |
          histogram_quantile(0.99,
            sum by (le, domain, service, environment) (
              rate(platform_http_request_duration_seconds_bucket{job="iam-org-membership"}[5m])
            )
          ) > 25.0
        for: 5m
        labels:
          severity: critical
          team: platform
          metric_status: proposed
        annotations:
          summary: iam-org-membership p99 latency above 25s — approaching timeout
          description: >-
            The p99 request duration is {{ $value | humanizeDuration }}, approaching
            the 30s application-level timeout. Requests are likely timing out for
            a significant fraction of users. Immediate investigation required.

  # ── Fail-closed & data-integrity alerts (page) ──────────────────────────────
  - name: iam-org-membership.integrity
    interval: 30s
    rules:

      - alert: IAMFutureLifecycleEventRejected
        # EVT-15 future-time clamp — any occurrence pages. Counted at the reject
        # site; the DLQ forward itself is platform_dlq_messages_total{reason="explicit"}.
        expr: sum by (domain, service, environment) (rate(iam_org_membership_consumed_event_rejected_total{reason="future_time_clamp"}[5m])) > 0
        for: 5m
        labels:
          severity: page
          service: iam-org-membership
        annotations:
          summary: "EVT-15 clamp firing — a producer's clock is skewed"
          description: |
            iam-org-membership rejected {{ $value }} lifecycle events/sec via
            the EVT-15 future-time clamp. A producer emitted events whose
            .time exceeds now() + MAX_LIFECYCLE_EVENT_SKEW_SECONDS. Investigate
            the producing service's clock (NTP), then flush its DLQ.
          runbook: "iam-org-membership/evt15-future-time-clamp"

      - alert: IAMConsumedEventSchemaViolation
        # A consumed payload failed its embedded JSON Schema and was sent
        # straight to the DLQ (cmd/server/inbound_schema.go). Every event of
        # that type from that producer is being dead-lettered, so the tenant
        # projection is drifting — page.
        expr: sum by (domain, service, environment, event_type) (rate(iam_org_membership_consumed_event_rejected_total{reason="schema_violation"}[5m])) > 0
        for: 5m
        labels:
          severity: page
          service: iam-org-membership
        annotations:
          summary: "Consumed {{ $labels.event_type }} events violate their schema"
          description: |
            iam-org-membership is rejecting {{ $labels.event_type }} events to
            the DLQ because the payload fails the embedded consumed-event
            schema. Either the producer broke its contract, or this service's
            api/asyncapi.yaml is stale. Inspect a DLQ message (DLQReason=
            schema_violation), fix the side that is wrong, then redrive.
          runbook: "iam-org-membership/consumed-schema-violation"

      - alert: IAMMalformedInboundMessage
        # platform-events forwarded a message it could not parse as an event
        # envelope (malformed) or whose Glue payload it could not decode
        # (decode_error) to the queue's DLQ. Before WithDLQForwarding these
        # were deleted and only logged; now they are kept, so the original
        # body can be inspected and redriven.
        expr: sum by (domain, service, environment, reason) (rate(platform_dlq_messages_total{operation="consume", reason=~"malformed|decode_error"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: iam-org-membership
        annotations:
          summary: "Unparseable messages ({{ $labels.reason }}) are reaching the DLQ"
          description: |
            iam-org-membership's consumer forwarded messages it could not parse
            ({{ $labels.reason }}) to a DLQ. The library logs the message ID and
            body_sha256 (never the body), so inspect the DLQ copy itself: its
            DLQReason, OriginalQueue and FailedAt attributes say where it came
            from. Fix the producer, then redrive.
          runbook: "iam-org-membership/malformed-inbound-message"

      - alert: IAMCrossTenantRLSViolation
        expr: rate(iam_rls_violations_total{violation_type="cross_tenant_access"}[5m]) > 0
        for: 1m
        labels:
          severity: page
          service: iam-org-membership
        annotations:
          summary: "RLS cross-tenant access attempts observed (RLS-3)"
          description: |
            {{ $value }} cross-tenant RLS violations/sec sampled from
            rls_violation_log. Even sampled hits mean a query wrote/read
            with an app.tenant_id GUC that did not match the row. Immediately
            audit rls_violation_log for the source query.
          runbook: "iam-org-membership/rls-cross-tenant"

      - alert: IAMOrgMembershipTenantHeaderPathMismatch
        expr: sum by (route, action) (rate(iam_org_membership_tenant_header_path_mismatch_total[15m])) > 0
        for: 15m
        labels:
          severity: info
          service: iam-org-membership
        annotations:
          summary: "Internal caller sends x-tenant-id different from the path tenant (IAPI-6)"
          description: |
            {{ $labels.route }} ({{ $labels.action }}): {{ $value }}/s requests whose
            x-tenant-id differs from the path tenant. The path tenant is
            authoritative; in strict mode these requests are rejected 400
            TENANT_MISMATCH. Find the caller from the tenant_header_path_mismatch
            WARN log and fix its header before enabling strict mode.
          runbook: "iam-org-membership/tenant-header-path-mismatch"

      - alert: IAMTenantOwnerless
        expr: iam_org_membership_tenant_ownerless > 0
        for: 30m
        labels:
          severity: page
          service: iam-org-membership
        annotations:
          summary: "One or more tenants have no active tenant_owner (TM-12/T-13)"
          description: |
            {{ $value }} tenant(s) have ownerless_since IS NOT NULL. Recover
            via O-7 POST /operator/tenants/:id/reassign-owner with an existing
            active member as the new owner.
          runbook: "iam-org-membership/tenant-ownerless"

  # ── Reconciler health (ticket) ──────────────────────────────────────────────
  - name: iam-org-membership.reconcilers
    interval: 5m
    rules:

      - alert: IAMRealmSyncPendingSustained
        expr: iam_org_membership_realm_sync_pending > 0
        for: 1h
        labels:
          severity: ticket
          service: iam-org-membership
        annotations:
          summary: "T-15 realm-sync-pending marker not clearing"
          description: |
            {{ $value }} tenants have realm_sync_pending=true for >1h. Either
            the realm-config-sync CronJob isn't running or Realm Provisioner
            is returning non-2xx. Check RP health then the cron's last run.
          runbook: "iam-org-membership/realm-sync-pending"

      - alert: IAMPendingInvitationsStale
        expr: iam_org_membership_pending_invitations_stale > 0
        for: 30m
        labels:
          severity: ticket
          service: iam-org-membership
        annotations:
          summary: "invitation-expiry CronJob may have stopped"
          description: |
            {{ $value }} pending invitations past expires_at that
            invitation-expiry hasn't flipped to 'expired' yet. Check the
            CronJob's last successful run and pod logs.
          runbook: "iam-org-membership/invitation-expiry"

      - alert: IAMSeatOverageActive
        expr: iam_org_membership_seat_overage_active > 0
        for: 24h
        labels:
          severity: ticket
          service: iam-org-membership
        annotations:
          summary: "Tenants in seat overage for >24h"
          description: |
            {{ $value }} tenants have overage_since set for >24h. Not a bug —
            this is a business signal for Billing to reach out. Grace window
            (default 30d) triggers Billing enforcement per SEAT-4.
          runbook: "iam-org-membership/seat-overage-business"

  # ── Outbox runner ───────────────────────────────────────────────────────────
  - name: iam_org_membership_outbox
    rules:

      - alert: IAMOrgMembershipOutboxDeadLetters
        # A rising count means SNS is unreachable, a schema is invalid, or the
        # outbox runner cannot make progress on some subset of events.
        # platform-events records outbox dead-letters (records moved to
        # outbox_dead_letters after OUTBOX_MAX_ATTEMPTS) as
        # platform_dlq_messages_total{operation="outbox_publish",reason="max_attempts"}.
        expr: |
          sum by (domain, service, environment) (increase(platform_dlq_messages_total{service="iam-org-membership", operation="outbox_publish"}[30m])) > 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: iam-org-membership outbox events moved to dead-letter
          description: >-
            One or more outbox events have exceeded max retries (OUTBOX_MAX_ATTEMPTS).
            Check the outbox runner logs for SNS publish errors and verify
            SNS_TOPIC_MEMBERSHIP_ARN / SNS_TOPIC_TENANT_ARN connectivity.
          runbook: "iam-org-membership/outbox-dead-letter"

  # ── Outbox ordering, backlogs and database pools (platform library metrics,
  #    proposed in the registry) ───────────────────────────────────────────────
  - name: iam-org-membership.platform-libraries
    rules:

      - alert: IAMOrgMembershipOutboxOrderingBlocked
        # Ordered outbox records (one key per tenant/subject, EnqueueOrdered)
        # waiting behind a head record that keeps failing to publish. The key
        # clears when the head is published or dead-lettered (OUTBOX_MAX_ATTEMPTS).
        expr: |
          max by (domain, service, environment) (platform_outbox_ordering_blocked_events{service="iam-org-membership"}) > 0
        for: 15m
        labels:
          severity: warning
          team: platform
          metric_status: proposed
        annotations:
          summary: iam-org-membership ordered outbox events are blocked behind a failing record
          description: >-
            {{ $value }} outbox records are waiting for an earlier record of the
            same tenant/subject key to publish. Find the failing head in the outbox
            runner logs (last_error) and fix it, or let it dead-letter.
          runbook: "iam-org-membership/outbox-ordering-blocked"

      - alert: IAMOrgMembershipOutboxBacklog
        # The oldest due outbox record has waited more than 5 minutes: SNS is
        # failing transiently (no attempt is counted, so nothing dead-letters) or
        # the runner cannot keep up.
        expr: |
          max by (domain, service, environment) (platform_outbox_oldest_pending_age{service="iam-org-membership"}) > 300
        for: 10m
        labels:
          severity: warning
          team: platform
          metric_status: proposed
        annotations:
          summary: iam-org-membership outbox delivery is more than 5 minutes behind
          description: >-
            The oldest pending outbox event is {{ $value | humanizeDuration }} old.
            Check the outbox runner logs for SNS publish errors
            and platform_outbox_pending_events.
          runbook: "iam-org-membership/outbox-backlog"

      - alert: IAMOrgMembershipDLQBacklog
        # Messages sitting in an inbound queue's DLQ (sampled every
        # SQS_QUEUE_DEPTH_INTERVAL). Complements the inflow alerts with the backlog.
        expr: |
          max by (domain, service, environment, queue) (platform_dlq_depth{service="iam-org-membership"}) > 0
        for: 30m
        labels:
          severity: warning
          team: platform
          metric_status: proposed
        annotations:
          summary: Messages are waiting in the {{ $labels.queue }} DLQ
          description: >-
            {{ $value }} messages in the DLQ of {{ $labels.queue }}. Inspect their
            DLQReason attribute, fix the cause, then redrive.
          runbook: "iam-org-membership/dlq-backlog"

      - alert: IAMOrgMembershipDBPoolSaturated
        # Worst replica per pool (pgcommon's reference rule, scoped to this service).
        expr: |
          max by (domain, service, environment, pool) (
            sum by (domain, service, environment, pool, instance) (platform_db_pool_connections{service="iam-org-membership", state="acquired"})
              /
            (sum by (domain, service, environment, pool, instance) (platform_db_pool_max_connections{service="iam-org-membership"}) > 0)
          ) > 0.9
        for: 10m
        labels:
          severity: warning
          team: platform
          metric_status: proposed
        annotations:
          summary: iam-org-membership Postgres pool {{ $labels.pool }} is over 90% utilised
          description: >-
            {{ $value | humanizePercentage }} of pool {{ $labels.pool }}'s connections are
            checked out on the busiest replica; callers are about to queue for
            connections (pool="default" is the API pool, pool="system" the BYPASSRLS pool).
          runbook: "iam-org-membership/db-pool-saturated"

      - alert: IAMOrgMembershipDBAcquireErrors
        expr: |
          max by (domain, service, environment, pool) (
            (
                sum by (domain, service, environment, pool, instance) (rate(platform_db_pool_acquires_total{service="iam-org-membership", outcome="error"}[5m]))
              or
                sum by (domain, service, environment, pool, instance) (rate(platform_db_pool_acquires_total{service="iam-org-membership"}[5m])) * 0
            )
              /
            (sum by (domain, service, environment, pool, instance) (rate(platform_db_pool_acquires_total{service="iam-org-membership"}[5m])) > 0)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
          metric_status: proposed
        annotations:
          summary: iam-org-membership cannot get Postgres connections from pool {{ $labels.pool }}
          description: >-
            {{ $value | humanizePercentage }} of connection acquires are failing on the
            worst replica (timeouts, closed pool or database unreachable). Requests
            answer 503 db_unavailable.
          runbook: "iam-org-membership/db-acquire-errors"

      - alert: IAMOrgMembershipDBRetriesExhausted
        expr: |
          sum by (domain, service, environment, pool, reason) (increase(platform_db_transaction_retries_exhausted_total{service="iam-org-membership"}[15m])) > 0
        labels:
          severity: warning
          team: platform
          metric_status: proposed
        annotations:
          summary: iam-org-membership transactions failed after exhausting {{ $labels.reason }} retries
          description: >-
            Transactions on pool {{ $labels.pool }} kept hitting {{ $labels.reason }}
            conflicts through every retry; callers got 409 concurrent_update.
          runbook: "iam-org-membership/db-retries-exhausted"

  # ── Outbound dependency health (ticket / page) ──────────────────────────────
  - name: iam-org-membership.outbound
    interval: 30s
    rules:

      - alert: IAMSessionRevokeFailedSustained
        expr: rate(iam_auth_session_revoke_failed_total[5m]) > 0.1
        for: 15m
        labels:
          severity: page
          service: iam-org-membership
        annotations:
          summary: "AUTH-8 fail-open: RP RevokeUserSessions failing at >0.1/s"
          description: |
            {{ $value }} RP RevokeUserSessions failures/sec sustained. The
            TTL backstop (5-min access-token + 300s cache) is still bounding
            elevated privilege but a persistent failure means removed users
            keep JWT sessions for the full backstop window. Check RP health.
          runbook: "iam-org-membership/auth8-revoke-fail-open"

      - alert: IAMStaleLifecycleEventSkippedElevated
        expr: rate(iam_lifecycle_event_skipped_total[10m]) > 1
        for: 30m
        labels:
          severity: ticket
          service: iam-org-membership
        annotations:
          summary: "Elevated EVT-14 stale-skip rate — consumer lag or producer reorder"
          description: |
            {{ $value }} events/sec are being dropped by EVT-14 (event.time
            <= tenants.last_event_at). Normal under producer reordering, but
            sustained rate suggests consumer lag on the source topic. Check
            SQS ApproximateAgeOfOldestMessage.
          runbook: "iam-org-membership/evt14-stale-elevated"

  # ── Forward-compat signal (ticket) ──────────────────────────────────────────
  - name: iam-org-membership.forward-compat
    interval: 5m
    rules:

      - alert: IAMUnknownEventType
        expr: rate(iam_org_membership_unknown_event_acknowledged_total[10m]) > 0
        for: 30m
        labels:
          severity: ticket
          service: iam-org-membership
        annotations:
          summary: "A producer is emitting an event type this consumer doesn't handle"
          description: |
            iam-org-membership is silently ack'ing events of type
            "{{ $labels.event_type }}". This is
            forward-compat behavior (silent ack + log + metric), but the
            producer has added a type we should be handling. Add a case in
            membership_event_consumer.go / classify().
          runbook: "iam-org-membership/unknown-event-type"

  # ── Audit delivery (AL-5 best-effort) ───────────────────────────────────────
  - name: iam_org_membership_audit_delivery
    rules:

      - alert: IAMAuditDeliveryFailed
        expr: |
          sum by (domain, service, environment, entry_type) (
            rate(iam_org_membership_audit_delivery_failed_total{service="iam-org-membership"}[10m])
          ) > 0
        for: 10m
        labels:
          severity: ticket
          team: platform
          service: iam-org-membership
        annotations:
          summary: "iam-org-membership AL-5 audit delivery failures — records may be missing"
          description: |
            Best-effort AL-5 direct-write calls from TenantService or InvitationService are
            returning errors. Audit is fail-open so P-2 / invite flows continue, but
            entry_type={{ $labels.entry_type }} records are silently absent from the audit log.
            Check AUDIT_LOG_BASE_URL is set and iam-audit-log is healthy.
          runbook: "iam-org-membership/audit-delivery-failed"

  # ── SQS consumer health (OBS-2) ─────────────────────────────────────────────
  - name: iam_org_membership_consumer_health
    rules:

      - alert: IAMOrgMembershipConsumerDead
        expr: |
          # Recorded by platform-events' SQS consumer, per queue.
          sum by (domain, service, environment, queue) (rate(platform_messages_received_total{service="iam-org-membership"}[10m])) == 0
        for: 5m
        labels:
          severity: critical
          team: platform
          service: iam-org-membership
        annotations:
          summary: "iam-org-membership SQS consumer has stopped receiving messages"
          description: |
            No messages have been received in the last 10 minutes. The SQS consumer
            goroutine may have panicked or stopped. lifecycle events (tenant status
            changes, billing events) are not being processed — tenants.status will
            drift. Restart the pod if the consumer does not recover.
          runbook: "iam-org-membership/consumer-dead"
