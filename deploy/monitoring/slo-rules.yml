# SLO recording + burn-rate alerts for iam-org-membership (§11.1).
#
# Three SLOs are declared:
#
#  SLO-1  I-8 hot-path latency
#         Target: 99% of /internal/users/:id/memberships requests complete
#         within 30 ms (cache miss); 95% within 15 ms (cache hit).
#
#  SLO-2  Write-path error rate
#         Target: 99.9% of mutating requests on /api/v1/tenants/* return a
#         non-5xx status (excludes intentional 4xx like optimistic-lock 409).
#
#  SLO-3  Reconciler convergence
#         Target: durable markers (realm_sync_pending, kc_cleanup_pending)
#         clear within 2 CronJob cycles (default 20 min).
#
# Recording rules pre-compute the SLI numerator/denominator so alert rules
# can key off a scalar. SLIs aggregate by (domain, service, environment) —
# the Observability Standard's identity labels — so each environment burns
# its own budget.
#
# metric_status: proposed — the HTTP SLIs read platform_http_request_
# duration_seconds / platform_http_requests_total (platform-gincommon). They
# replace the removed http_* names and are still Proposed in the Platform
# Observability Registry (awaiting governance), so every alert built on them
# carries the label metric_status: proposed. Alerts follow the multi-window multi-burn-rate
# pattern (SRE book Ch. 5): a slow burn signals an ongoing degradation,
# a fast burn signals an outage worth paging on.

groups:
  # ── SLI recording ───────────────────────────────────────────────────────
  - name: iam-org-membership.slo.records
    interval: 30s
    rules:
      # I-8 latency histogram → error budget window.
      # metric_status: proposed (platform_http_request_duration_seconds).
      # route is the Gin route template recorded by platform-gincommon.
      # The registry's request_duration buckets have no 0.03 boundary
      # (…0.015, 0.025, 0.05…), so the 30 ms target is measured
      # conservatively at le="0.025" (the old le="0.030" matched no bucket).
      - record: iam:i8_latency_sli:ratio_rate_5m
        expr: |
          sum by (domain, service, environment) (rate(platform_http_request_duration_seconds_bucket{
            service="iam-org-membership",
            route="/api/v1/internal/users/:id/memberships",
            le="0.025"
          }[5m]))
          /
          sum by (domain, service, environment) (rate(platform_http_request_duration_seconds_count{
            service="iam-org-membership",
            route="/api/v1/internal/users/:id/memberships"
          }[5m]))

      # metric_status: proposed (platform_http_request_duration_seconds).
      - record: iam:i8_latency_sli:ratio_rate_1h
        expr: |
          sum by (domain, service, environment) (rate(platform_http_request_duration_seconds_bucket{
            service="iam-org-membership",
            route="/api/v1/internal/users/:id/memberships",
            le="0.025"
          }[1h]))
          /
          sum by (domain, service, environment) (rate(platform_http_request_duration_seconds_count{
            service="iam-org-membership",
            route="/api/v1/internal/users/:id/memberships"
          }[1h]))

      # Write-path error rate (5xx only — 4xx are intentional).
      # metric_status: proposed (platform_http_requests_total). The 5xx
      # selector is status_class="5xx" (the label platform-gincommon emits).
      - record: iam:write_error_rate:ratio_rate_5m
        expr: |
          sum by (domain, service, environment) (rate(platform_http_requests_total{
            service="iam-org-membership",
            method=~"POST|PUT|PATCH|DELETE",
            status_class="5xx"
          }[5m]))
          /
          clamp_min(sum by (domain, service, environment) (rate(platform_http_requests_total{
            service="iam-org-membership",
            method=~"POST|PUT|PATCH|DELETE"
          }[5m])), 0.001)

      # Reconciler convergence — durable marker persistence: recorded as
      # iam:reconciler_markers:sum in the iam_org_membership_slo3_fixed group
      # below (OBS-5 replaced the earlier 5x-weighted duplicate of this
      # record, which made promtool reject the file).

  # ── SLO burn-rate alerts (multi-window) ─────────────────────────────────
  - name: iam-org-membership.slo.burn
    interval: 1m
    rules:
      # SLO-1: fast burn on I-8 latency (2% budget in 1h → page).
      - alert: IAMSLO1_I8LatencyFastBurn
        expr: |
          (1 - iam:i8_latency_sli:ratio_rate_5m) > (14.4 * (1 - 0.99))
          and
          (1 - iam:i8_latency_sli:ratio_rate_1h) > (14.4 * (1 - 0.99))
        for: 2m
        labels:
          severity: page
          slo: SLO-1
          service: iam-org-membership
          metric_status: proposed
        annotations:
          summary: "SLO-1 fast-burn: I-8 P99 latency degraded"
          description: |
            I-8 /internal/users/:id/memberships is missing the 30 ms target
            for {{ $value | humanizePercentage }} of requests over the last
            5m + 1h windows. Cache miss rate elevated OR the joined
            projection query is slow. Check om:memberships cache health
            and Postgres query planner for tenant_memberships.

      # SLO-1: slow burn (5% budget in 24h → ticket).
      - alert: IAMSLO1_I8LatencySlowBurn
        expr: |
          (1 - iam:i8_latency_sli:ratio_rate_1h) > (6 * (1 - 0.99))
        for: 15m
        labels:
          severity: ticket
          slo: SLO-1
          service: iam-org-membership
          metric_status: proposed
        annotations:
          summary: "SLO-1 slow-burn: I-8 latency below target for 15m+"

      # SLO-2: write-path 5xx spike.
      - alert: IAMSLO2_WriteErrorRateFastBurn
        expr: iam:write_error_rate:ratio_rate_5m > (14.4 * 0.001)
        for: 2m
        labels:
          severity: page
          slo: SLO-2
          service: iam-org-membership
          metric_status: proposed
        annotations:
          summary: "SLO-2 fast-burn: write-path 5xx rate above target"
          description: |
            {{ $value | humanizePercentage }} of mutating requests are
            returning 5xx. Likely Postgres or an outbound service (RP/UP)
            failure — cross-reference
            iam_auth_session_revoke_failed_total and /readyz.

      # SLO-3: reconciler markers accumulating.
      - alert: IAMSLO3_ReconcilerMarkersElevated
        expr: iam:reconciler_markers:sum > 5
        for: 20m
        labels:
          severity: ticket
          slo: SLO-3
          service: iam-org-membership
        annotations:
          summary: "SLO-3: durable markers accumulating (reconciler convergence)"
          description: |
            Combined durable-marker gauge = {{ $value }} for 20m+. Check
            each CronJob's last successful run:
              - realm-config-sync (T-15)
              - invitation-expiry
              - operator O-7 reassign-owner (T-13)

  # ── OBS-4: 15ms cache-hit SLI recording rules ──────────────────────────────
  - name: iam_org_membership_i8_hit_sli
    rules:
      # 5m ratio of I-8 requests served within 15ms cache-hit SLO target.
      # metric_status: proposed (platform_http_request_duration_seconds).
      - record: iam:i8_latency_hit_sli:ratio_rate_5m
        expr: |
          sum by (domain, service, environment) (rate(platform_http_request_duration_seconds_bucket{service="iam-org-membership",route="/api/v1/internal/users/:id/memberships",le="0.015"}[5m]))
          /
          sum by (domain, service, environment) (rate(platform_http_request_duration_seconds_count{service="iam-org-membership",route="/api/v1/internal/users/:id/memberships"}[5m]))

      # metric_status: proposed (platform_http_request_duration_seconds).
      - record: iam:i8_latency_hit_sli:ratio_rate_1h
        expr: |
          sum by (domain, service, environment) (rate(platform_http_request_duration_seconds_bucket{service="iam-org-membership",route="/api/v1/internal/users/:id/memberships",le="0.015"}[1h]))
          /
          sum by (domain, service, environment) (rate(platform_http_request_duration_seconds_count{service="iam-org-membership",route="/api/v1/internal/users/:id/memberships"}[1h]))

      # SLO-1b slow-burn: cache-hit rate below 90% for 1h signals Valkey degradation.
      - alert: IAMSLO1b_CacheHitRateLow
        expr: iam:i8_latency_hit_sli:ratio_rate_1h < 0.90
        for: 5m
        labels:
          severity: warning
          slo: SLO-1b
          service: iam-org-membership
          metric_status: proposed
        annotations:
          summary: "SLO-1b: I-8 cache-hit rate below 90% (Valkey degraded?)"
          description: |
            I-8 requests served within 15ms = {{ $value | humanizePercentage }}.
            Check Valkey connectivity, eviction rate, and om:memberships TTL.
          runbook: "iam-org-membership/i8-latency"

  # ── OBS-5: SLO-3 composite gauge ────────────────────────────────────────────
  - name: iam_org_membership_slo3_fixed
    rules:
      - record: iam:reconciler_markers:sum
        expr: |
          iam_org_membership_tenant_ownerless
          + iam_org_membership_realm_sync_pending
          + iam_org_membership_pending_invitations_stale
