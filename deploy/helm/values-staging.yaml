# Staging environment overrides for iam-org-membership.
# Merge with base values.yaml: helm upgrade ... -f values.yaml -f values-staging.yaml

env:
  APP_ENV: "staging"
  LOG_LEVEL: "info"
  OTEL_TRACES_SAMPLER_RATIO: "0.5"

# CD-19: Commercial domain callers admitted in staging exactly as in prod —
# NetworkPolicy (L3/L4) AND the Istio AuthorizationPolicy (L7 mTLS), so the
# first staging deployment exercises the same mesh rules as prod (LLD §10.2,
# rev 2.40). Prerequisite, same as prod: Istio installed and
# PeerAuthentication STRICT active in the iam namespace before deploying.
# test/helm/access_matrix_test.go (make helm-access-check, CI) pins the
# rendered rules for staging and prod.
commercialCallers:
  enabled: true
  istio:
    enabled: true            # L7 mTLS enforcement active in staging (matches prod)
    trustDomain: cluster.local
    existingCallerNamespaces:
      - iam                    # IAM namespace: AuthZ Enrichment, Group Mapping, Audit Log, Tender ACL, Delegation, Event Consumer
      - gateway                # Ingress controller / Envoy Gateway data plane
      - observability          # Prometheus scrape (port 9090 only — enforced at L3 by metricsIngress)

# Tender Service — I-20 GET */departments with notPaths /api/v1/tenants/*
# (CD-19, TND-OM-P3). Enabled in staging and prod so the access-matrix CI
# test (make helm-access-check) validates the Istio rule is correctly rendered
# and path-restricted. The tender-management namespace must exist in the cluster
# and have Istio sidecar injection before this rule takes effect.
tenderCaller:
  enabled: true
  namespace: tender-management
  namespaceSelector:
    kubernetes.io/metadata.name: tender-management
  podSelector: {}
