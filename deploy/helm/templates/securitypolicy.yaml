{{- $httpRouteEnabled := and .Values.ingress.enabled (eq (.Values.ingress.type | default "Ingress") "HTTPRoute") }}
{{- if and $httpRouteEnabled .Values.ingress.securityPolicy.enabled .Values.ingress.securityPolicy.cors.enabled }}
# Envoy Gateway SecurityPolicy — attaches CORS to the HTTPRoute at the
# gateway layer. The gateway rate limit is not here: Envoy Gateway carries
# rate limits on BackendTrafficPolicy (backendtrafficpolicy.yaml). Requires Envoy Gateway v1.8+ (mergeType, below; gateway.envoyproxy.io/v1alpha1 CRD).
#
# mergeType (ingress.securityPolicy.mergeType, default StrategicMerge) merges
# this route policy with the Gateway-level SecurityPolicy. Unset, Envoy
# Gateway applies only the most specific policy, so this one would REPLACE the
# gateway's — dropping its JWT validation and ext_authz (AuthZ Enrichment,
# which sets the trusted x-tenant-id / x-user-id / ... identity headers) on
# these routes. mergeType needs Envoy Gateway v1.8+.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "iam-org-membership.fullname" . }}
  labels:
    {{- include "iam-org-membership.labels" . | nindent 4 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "iam-org-membership.fullname" . }}
  {{- with .Values.ingress.securityPolicy.mergeType }}
  mergeType: {{ . }}
  {{- end }}
  cors:
    allowOrigins:
      {{- range .Values.ingress.securityPolicy.cors.allowOrigins }}
      - type: Exact
        value: {{ . | quote }}
      {{- end }}
    allowMethods:
      {{- toYaml .Values.ingress.securityPolicy.cors.allowMethods | nindent 6 }}
    allowHeaders:
      {{- toYaml .Values.ingress.securityPolicy.cors.allowHeaders | nindent 6 }}
    maxAge: {{ .Values.ingress.securityPolicy.cors.maxAge | quote }}
{{- end }}
