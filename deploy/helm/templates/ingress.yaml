{{- if and .Values.ingress.enabled (eq (.Values.ingress.type | default "Ingress") "Ingress") }}
# SECURITY: The /metrics endpoint is unauthenticated. When Ingress is enabled,
# ensure networkPolicy.enabled=true so /metrics is only reachable from the
# Prometheus namespace. Alternatively restrict /metrics via a separate
# internal-class Ingress for the metrics path only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "iam-org-membership.fullname" . }}
  labels:
    {{- include "iam-org-membership.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "iam-org-membership.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
