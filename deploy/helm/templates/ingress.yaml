{{- if and .Values.ingress.enabled (eq (.Values.ingress.type | default "Ingress") "Ingress") }}
# NOTE: /metrics is served on its own dedicated port (service.metricsPort,
# not service.port) and is never routed through this Ingress — it's not
# reachable here regardless of path rules below. See networkpolicy.yaml
# for the NetworkPolicy rule restricting it to the monitoring namespace.
#
# TODO PUB-1 (LLD §16 OQ-10): GET /api/v1/public/tenants/resolve must reach
# this service with NO auth — it needs an explicit ext_authz-bypass route (the
# same carve-out as Keycloak's /auth, /token), plus gateway rate-limit/CAPTCHA
# (PUBRES-3). Platform/infra config, tracked separately; not in this chart yet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "iam-org-membership.fullname" . }}
  labels:
    {{- include "iam-org-membership.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "iam-org-membership.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
