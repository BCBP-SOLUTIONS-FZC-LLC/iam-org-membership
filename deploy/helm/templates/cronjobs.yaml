{{- range $key, $cj := .Values.cronjobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "iam-org-membership.fullname" $ }}-{{ $key }}
  labels:
    {{- include "iam-org-membership.labels" $ | nindent 4 }}
    app.kubernetes.io/component: reconciler
    reconciler.iam/job: {{ $cj.job }}
spec:
  schedule: {{ $cj.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $.Values.serviceAccount.name }}
          securityContext:
            {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          containers:
            - name: reconciler
              image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              command: ["/reconciler"]
              args: ["--job={{ $cj.job }}"]
              securityContext:
                {{- toYaml $.Values.securityContext | nindent 16 }}
              env:
                - name: RECONCILER_JOB
                  value: {{ $cj.job | quote }}
                {{- range $k, $v := $.Values.env }}
                - name: {{ $k }}
                  value: {{ $v | quote }}
                {{- end }}
              envFrom:
                - secretRef:
                    name: {{ include "iam-org-membership.fullname" $ }}
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
{{- end }}
