{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "iam-org-membership.fullname" . }}
  labels:
    {{- include "iam-org-membership.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: iam_org_membership_availability
      rules:
        - alert: IAMOrgMembershipDown
          expr: |
            absent(up{job={{ include "iam-org-membership.fullname" . | quote }}} == 1)
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: iam-org-membership has no healthy instances
            description: >-
              No iam-org-membership pods have been scraped as healthy for 2 minutes.
              Check pod readiness: kubectl get pods -l app.kubernetes.io/name=iam-org-membership

        - alert: IAMOrgMembershipReplicasMissing
          expr: |
            sum(up{job={{ include "iam-org-membership.fullname" . | quote }}}) < 2
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: iam-org-membership running below minimum replica count
            description: >-
              Fewer than 2 replicas are healthy. HPA minReplicas is 2 (LLD §13.1);
              a further disruption will block node drains.
              Current healthy count: {{ "{{ $value }}" }}.

    # metric_status: proposed — platform_http_requests_total /
    # platform_http_request_duration_seconds (platform-gincommon) replace the
    # removed http_* names and are still Proposed in the Platform
    # Observability Registry; their alerts carry metric_status: proposed.
    - name: iam_org_membership_errors
      rules:
        - alert: IAMOrgMembershipHighErrorRate
          expr: |
            sum by (domain, service, environment) (rate(platform_http_requests_total{job={{ include "iam-org-membership.fullname" . | quote }}, status_class="5xx"}[5m]))
              /
            sum by (domain, service, environment) (rate(platform_http_requests_total{job={{ include "iam-org-membership.fullname" . | quote }}}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: warning
            team: platform
            metric_status: proposed
          annotations:
            summary: iam-org-membership 5xx error rate above 5%
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of requests are returning 5xx errors
              over the last 5 minutes. Investigate recent deployments, dependency
              health (Postgres, Valkey, SNS/SQS, Workflow/UP/RP), and application logs.

        - alert: IAMOrgMembershipCriticalErrorRate
          expr: |
            sum by (domain, service, environment) (rate(platform_http_requests_total{job={{ include "iam-org-membership.fullname" . | quote }}, status_class="5xx"}[5m]))
              /
            sum by (domain, service, environment) (rate(platform_http_requests_total{job={{ include "iam-org-membership.fullname" . | quote }}}[5m]))
            > 0.20
          for: 2m
          labels:
            severity: critical
            team: platform
            metric_status: proposed
          annotations:
            summary: iam-org-membership 5xx error rate above 20%
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of requests are returning 5xx errors.
              This exceeds the critical threshold. Escalate immediately — the service
              is severely degraded.

    - name: iam_org_membership_latency
      rules:
        # SLO-2 per LLD §11.1 — I-8 hot-path p95 must stay <= 30 ms (cache miss).
        - alert: IAMOrgMembershipI8HotPathLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le, domain, service, environment) (
                rate(platform_http_request_duration_seconds_bucket{
                  job={{ include "iam-org-membership.fullname" . | quote }},
                  route="/api/v1/internal/users/:id/memberships"
                }[5m])
              )
            ) > 0.030
          for: 5m
          labels:
            severity: warning
            team: platform
            metric_status: proposed
            slo: SLO-2
          annotations:
            summary: I-8 memberships hot-path p95 above 30 ms
            description: >-
              GET /internal/users/:id/memberships p95 is {{ "{{ $value | humanizeDuration }}" }},
              exceeding the 30 ms SLO. This endpoint is hit on every authenticated
              request — check Valkey cache hit rate (om:memberships) and Postgres
              planner for tenant_memberships/dept_memberships joins.

        - alert: IAMOrgMembershipHighLatency
          expr: |
            histogram_quantile(0.99,
              sum by (le, domain, service, environment) (
                rate(platform_http_request_duration_seconds_bucket{job={{ include "iam-org-membership.fullname" . | quote }}}[5m])
              )
            ) > 2.0
          for: 10m
          labels:
            severity: warning
            team: platform
            metric_status: proposed
          annotations:
            summary: iam-org-membership p99 latency above 2s
            description: >-
              The p99 request duration is {{ "{{ $value | humanizeDuration }}" }}, exceeding
              the 2s SLO threshold. Check slow-query logs (PG_SLOW_QUERY_THRESHOLD)
              and Valkey response times.

    - name: iam_org_membership_outbox
      rules:
        - alert: IAMOrgMembershipOutboxDeadLetters
          # Any outbox event moved to the dead-letter state is a hard signal —
          # SNS is unreachable or a schema violation is persistent.
          # platform-events records outbox dead-letters as
          # platform_dlq_messages_total{operation="outbox_publish",reason="max_attempts"}.
          expr: |
            sum by (domain, service, environment) (increase(platform_dlq_messages_total{job={{ include "iam-org-membership.fullname" . | quote }}, operation="outbox_publish"}[30m])) > 0
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: iam-org-membership outbox events moved to dead-letter
            description: >-
              One or more outbox events have exceeded max retries (OUTBOX_MAX_ATTEMPTS).
              Check the outbox runner logs for SNS publish errors and verify
              SNS_TOPIC_MEMBERSHIP_ARN / SNS_TOPIC_TENANT_ARN connectivity.

    - name: iam_org_membership_platform_libraries
      rules:
        - alert: IAMOrgMembershipOutboxOrderingBlocked
          # Ordered outbox records (one key per tenant/subject, EnqueueOrdered)
          # waiting behind a head record that keeps failing to publish. The key
          # clears when the head is published or dead-lettered (OUTBOX_MAX_ATTEMPTS).
          expr: |
            max by (domain, service, environment) (platform_outbox_ordering_blocked_events{job={{ include "iam-org-membership.fullname" . | quote }}}) > 0
          for: 15m
          labels:
            severity: warning
            team: platform
            metric_status: proposed
          annotations:
            summary: iam-org-membership ordered outbox events are blocked behind a failing record
            description: >-
              {{ "{{ $value }}" }} outbox records are waiting for an earlier record of the
              same tenant/subject key to publish. Find the failing head in the outbox
              runner logs (last_error) and fix it, or let it dead-letter.
            runbook: "iam-org-membership/outbox-ordering-blocked"

        - alert: IAMOrgMembershipOutboxBacklog
          # The oldest due outbox record has waited more than 5 minutes: SNS is
          # failing transiently (no attempt is counted, so nothing dead-letters) or
          # the runner cannot keep up.
          expr: |
            max by (domain, service, environment) (platform_outbox_oldest_pending_age{job={{ include "iam-org-membership.fullname" . | quote }}}) > 300
          for: 10m
          labels:
            severity: warning
            team: platform
            metric_status: proposed
          annotations:
            summary: iam-org-membership outbox delivery is more than 5 minutes behind
            description: >-
              The oldest pending outbox event is {{ "{{ $value | humanizeDuration }}" }} old.
              Check the outbox runner logs for SNS publish errors
              and platform_outbox_pending_events.
            runbook: "iam-org-membership/outbox-backlog"

        - alert: IAMOrgMembershipDLQBacklog
          # Messages sitting in an inbound queue's DLQ (sampled every
          # SQS_QUEUE_DEPTH_INTERVAL). Complements the inflow alerts with the backlog.
          expr: |
            max by (domain, service, environment, queue) (platform_dlq_depth{job={{ include "iam-org-membership.fullname" . | quote }}}) > 0
          for: 30m
          labels:
            severity: warning
            team: platform
            metric_status: proposed
          annotations:
            summary: Messages are waiting in the {{ "{{ $labels.queue }}" }} DLQ
            description: >-
              {{ "{{ $value }}" }} messages in the DLQ of {{ "{{ $labels.queue }}" }}. Inspect their
              DLQReason attribute, fix the cause, then redrive.
            runbook: "iam-org-membership/dlq-backlog"

        - alert: IAMOrgMembershipDBPoolSaturated
          # Worst replica per pool (pgcommon's reference rule, scoped to this service).
          expr: |
            max by (domain, service, environment, pool) (
              sum by (domain, service, environment, pool, instance) (platform_db_pool_connections{job={{ include "iam-org-membership.fullname" . | quote }}, state="acquired"})
                /
              (sum by (domain, service, environment, pool, instance) (platform_db_pool_max_connections{job={{ include "iam-org-membership.fullname" . | quote }}}) > 0)
            ) > 0.9
          for: 10m
          labels:
            severity: warning
            team: platform
            metric_status: proposed
          annotations:
            summary: iam-org-membership Postgres pool {{ "{{ $labels.pool }}" }} is over 90% utilised
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of pool {{ "{{ $labels.pool }}" }}'s connections are
              checked out on the busiest replica; callers are about to queue for
              connections (pool="default" is the API pool, pool="system" the BYPASSRLS pool).
            runbook: "iam-org-membership/db-pool-saturated"

        - alert: IAMOrgMembershipDBAcquireErrors
          expr: |
            max by (domain, service, environment, pool) (
              (
                  sum by (domain, service, environment, pool, instance) (rate(platform_db_pool_acquires_total{job={{ include "iam-org-membership.fullname" . | quote }}, outcome="error"}[5m]))
                or
                  sum by (domain, service, environment, pool, instance) (rate(platform_db_pool_acquires_total{job={{ include "iam-org-membership.fullname" . | quote }}}[5m])) * 0
              )
                /
              (sum by (domain, service, environment, pool, instance) (rate(platform_db_pool_acquires_total{job={{ include "iam-org-membership.fullname" . | quote }}}[5m])) > 0)
            ) > 0.05
          for: 5m
          labels:
            severity: critical
            team: platform
            metric_status: proposed
          annotations:
            summary: iam-org-membership cannot get Postgres connections from pool {{ "{{ $labels.pool }}" }}
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of connection acquires are failing on the
              worst replica (timeouts, closed pool or database unreachable). Requests
              answer 503 db_unavailable.
            runbook: "iam-org-membership/db-acquire-errors"

        - alert: IAMOrgMembershipDBRetriesExhausted
          expr: |
            sum by (domain, service, environment, pool, reason) (increase(platform_db_transaction_retries_exhausted_total{job={{ include "iam-org-membership.fullname" . | quote }}}[15m])) > 0
          labels:
            severity: warning
            team: platform
            metric_status: proposed
          annotations:
            summary: iam-org-membership transactions failed after exhausting {{ "{{ $labels.reason }}" }} retries
            description: >-
              Transactions on pool {{ "{{ $labels.pool }}" }} kept hitting {{ "{{ $labels.reason }}" }}
              conflicts through every retry; callers got 409 concurrent_update.
            runbook: "iam-org-membership/db-retries-exhausted"

    # LLD §11.2 — org-membership specific gauges/counters emitted by the 4
    # in-process exporter goroutines (started alongside the outbox runner in
    # cmd/server/main.go per our Option A decision) and the consumer/reconciler
    # counters.
    - name: iam_org_membership_business
      rules:
        - alert: IAMTenantOwnerless
          # TM-12 identity-layer escalation — ownerless_since IS NOT NULL means
          # a tenant has zero active tenant_owner and cannot self-recover.
          # Operator O-7 reassign-owner is the recovery path.
          expr: |
            max(iam_org_membership_tenant_ownerless) > 0
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: one or more tenants have no active tenant_owner (TM-12)
            description: >-
              iam_org_membership_tenant_ownerless = {{ "{{ $value | humanize }}" }} for 5m+. Recover via
              O-7 POST /operator/tenants/:id/reassign-owner with an existing
              active member as the new owner. Runbook: iam-org-membership/tenant-ownerless.

        - alert: IAMRealmSyncPending
          # T-15 realm-sync-pending marker: the local write happened but Realm
          # Provisioner PatchRealmConfig has not yet acknowledged.
          expr: |
            max(iam_org_membership_realm_sync_pending) > 0
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: realm-config-sync CronJob not draining pending markers
            description: >-
              iam_org_membership_realm_sync_pending has stayed non-zero for 15 minutes.
              Either the realm-config-sync CronJob isn't running or Realm Provisioner
              is returning non-2xx. Check RP health then the cron's last run.

        - alert: IAMSeatOverageActiveApproachingGrace
          # SEAT-4: overage_since past (SEAT_OVERAGE_GRACE_DAYS - 5) days.
          # Fires 5 days before grace window closes, giving ops a warning to
          # coordinate with Billing before enforcement kicks in.
          expr: |
            max(iam_org_membership_seat_overage_active) > 0
          for: 25d
          labels:
            severity: warning
            team: platform
          annotations:
            summary: tenants in seat overage approaching grace-window expiry
            description: >-
              {{ "{{ $value | humanize }}" }} tenants have been in seat overage for
              25+ days. Default SEAT_OVERAGE_GRACE_DAYS is 30 — Billing enforcement
              triggers when the window closes. Coordinate outreach now.

        - alert: IAMPendingInvitationsStale
          # Pending invitations past expires_at that invitation-expiry hasn't
          # flipped to 'expired'. Non-zero for >24h means the CronJob has stopped.
          expr: |
            max(iam_org_membership_pending_invitations_stale) > 0
          for: 24h
          labels:
            severity: warning
            team: platform
          annotations:
            summary: invitation-expiry CronJob may have stopped
            description: >-
              {{ "{{ $value | humanize }}" }} pending invitations are past expires_at.
              Check the invitation-expiry CronJob's last successful run and pod logs.

        - alert: IAMStaleLifecycleEventSkipped
          # EVT-14 recency guard — normal at low rates (producer reordering),
          # but a sustained non-zero rate suggests consumer lag.
          expr: |
            rate(iam_lifecycle_event_skipped_total[10m]) > 0
          for: 10m
          labels:
            severity: info
            team: platform
          annotations:
            summary: EVT-14 stale-skip rate elevated
            description: >-
              {{ "{{ $value | humanize }}" }}/s events are being dropped by EVT-14
              (event.time <= tenants.last_event_at). Normal under producer reordering,
              but sustained rate suggests consumer lag on the source topic.

        - alert: IAMFutureLifecycleEventRejected
          # EVT-15 future-time clamp — a producer's clock is skewed OR they
          # emitted an event >MAX_LIFECYCLE_EVENT_SKEW_SECONDS in the future.
          # Any occurrence pages. Counted at the reject site; the DLQ forward
          # itself is platform_dlq_messages_total{reason="explicit"}.
          expr: |
            sum by (domain, service, environment) (increase(iam_org_membership_consumed_event_rejected_total{reason="future_time_clamp"}[5m])) > 0
          labels:
            severity: critical
            team: platform
          annotations:
            summary: EVT-15 clamp firing — a producer's clock is skewed
            description: >-
              iam-org-membership rejected lifecycle events via the EVT-15 future-time
              clamp. A producer emitted events whose .time exceeds
              now() + MAX_LIFECYCLE_EVENT_SKEW_SECONDS. Investigate the producing
              service's clock (NTP), then flush its DLQ.

        - alert: IAMConsumedEventSchemaViolation
          # A consumed payload failed its embedded JSON Schema and was sent
          # straight to the DLQ (cmd/server/inbound_schema.go) — a producer
          # contract break or a stale local asyncapi.yaml.
          expr: |
            sum by (domain, service, environment, event_type) (increase(iam_org_membership_consumed_event_rejected_total{reason="schema_violation"}[5m])) > 0
          labels:
            severity: critical
            team: platform
          annotations:
            summary: Consumed {{ "{{ $labels.event_type }}" }} events violate their schema
            description: >-
              iam-org-membership is rejecting {{ "{{ $labels.event_type }}" }} events to
              the DLQ because the payload fails the embedded consumed-event schema.
              Either the producer broke its contract or this service's
              api/asyncapi.yaml is stale. Inspect a DLQ message
              (DLQReason=schema_violation), fix the wrong side, then redrive.

        - alert: IAMMalformedInboundMessage
          # platform-events forwarded an unparseable (malformed) or
          # undecodable (decode_error) message to the queue's DLQ. These used
          # to be deleted and only logged; now the original is kept.
          expr: |
            sum by (domain, service, environment, reason) (increase(platform_dlq_messages_total{operation="consume", reason=~"malformed|decode_error"}[5m])) > 0
          labels:
            severity: warning
            team: platform
          annotations:
            summary: Unparseable messages ({{ "{{ $labels.reason }}" }}) are reaching the DLQ
            description: >-
              iam-org-membership's consumer forwarded messages it could not parse
              to a DLQ. The library logs the message ID and body_sha256, never the
              body, so inspect the DLQ copy (DLQReason, OriginalQueue, FailedAt
              attributes), fix the producer, then redrive.

    - name: iam_org_membership_compliance
      rules:
        - alert: IAMOrgMembershipRLSCrossTenantAccess
          # cross_tenant_access means a valid GUC pointed at a different
          # tenant than the target row — this is either a real attack or a
          # serious application bug. Page immediately.
          expr: |
            increase(iam_rls_violations_total{violation_type="cross_tenant_access"}[5m]) > 0
          labels:
            severity: critical
            team: platform
            compliance: tenant-isolation
          annotations:
            summary: RLS blocked a cross-tenant access attempt
            description: >-
              A caller with a valid tenant GUC attempted to read/write a row
              belonging to a different tenant. Investigate the last 5 minutes
              of rls_violation_log for user_id, session_role, client_addr,
              and query_text. This alert has no `for` clause — one occurrence
              is enough to page.

        - alert: IAMOrgMembershipRLSMissingGUC
          expr: |
            rate(iam_rls_violations_total{violation_type="missing_or_invalid_guc"}[5m]) > 0
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: RLS violations from missing or invalid tenant GUC
            description: >-
              Sustained rate of missing_or_invalid_guc violations over 10m.
              A caller service is not setting app.tenant_id correctly.
              Check platform-pgcommon GUC middleware wiring.
{{- end }}
