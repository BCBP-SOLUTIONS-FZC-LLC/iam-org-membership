{{- if .Values.networkPolicy.enabled }}
# TODO PUB-1 (LLD §16 OQ-10): GET /api/v1/public/tenants/resolve must reach
# this service with NO auth — it needs an explicit ext_authz-bypass route (the
# same carve-out as Keycloak's /auth, /token), plus gateway rate-limit/CAPTCHA
# (PUBRES-3). Platform/infra config, tracked separately; not in this chart yet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iam-org-membership.fullname" . }}
  labels:
    {{- include "iam-org-membership.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iam-org-membership.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow API traffic from the ingress controller / gateway namespace.
    # For Envoy Gateway the data-plane pods run in the same namespace as the
    # Gateway resource; set ingressControllerNamespaceSelector to that namespace
    # label and ingressControllerPodSelector to the Envoy pod labels.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 14 }}
          {{- with .Values.networkPolicy.ingressControllerPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP

    # Allow internal service-to-service traffic within the same namespace.
    # Required so AuthZ Enrichment, User Profile, and Realm Provisioner
    # can call I-8 /internal/users/:id/memberships and the other internal routes.
    # (Workflow runs in its own namespace — see the workflowCallers rule below.)
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP

    # Allow Prometheus to scrape :9090/metrics — restricted to the
    # monitoring namespace. Metrics live on a SEPARATE port from the API,
    # so this rule (unlike the two above) does not grant any API access.
    {{- if .Values.networkPolicy.metricsIngress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.metricsPort }}
          protocol: TCP
    {{- end }}

    # Workflow services (workflowCallers) — I-13 / I-15 / I-19. L4 only: the
    # Istio AuthorizationPolicy, where enabled, limits them to those routes.
    {{- if .Values.workflowCallers.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.workflowCallers.namespaceSelector | nindent 14 }}
          {{- with .Values.workflowCallers.podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- end }}

    # Signup BFF (signupBffCaller) — the bff-signup pods only, never the whole
    # bff namespace (BFF-1). L4 only: the Istio AuthorizationPolicy, where
    # enabled, limits them to POST /api/v1/internal/tenants (I-1).
    {{- if .Values.signupBffCaller.enabled }}
    {{- if not .Values.signupBffCaller.podSelector }}
    {{- fail "signupBffCaller.podSelector is required: an empty selector would admit every pod in the bff namespace (BFF-1 requires pod-level admission)." }}
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.signupBffCaller.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.signupBffCaller.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- end }}
    # CD-19 — Commercial domain callers (Billing + Entitlements).
    # Billing (ns: billing, SA: commercial-billing) calls I-11 and I-18.
    # Entitlements (ns: commercial, SA: commercial-entitlements) calls I-17.
    # Only the API port is opened; metrics port is NOT included here.
    {{- if .Values.commercialCallers.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.commercialCallers.billing.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.commercialCallers.billing.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.commercialCallers.entitlements.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.commercialCallers.entitlements.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- end }}

    {{- with .Values.networkPolicy.additionalIngressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  egress:
    # Allow DNS resolution (required for all outbound connections, including
    # cluster-DNS lookups of the three outbound services).
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Allow HTTPS to AWS regional endpoints (SNS, SQS, Glue Schema Registry,
    # CloudWatch, STS). No S3 — org-membership does not use S3.
    - ports:
        - port: 443
          protocol: TCP

    # Allow PostgreSQL / PgBouncer connections. Container-internal port 5432;
    # 5433 permitted for stacks that publish PgBouncer on the sidecar port.
    - ports:
        - port: 5432
          protocol: TCP
        - port: 5433
          protocol: TCP

    # Allow Valkey (Redis-protocol) connections (advisory cache, CACHE-2/9).
    - ports:
        - port: 6379
          protocol: TCP

    # Allow OTel OTLP gRPC to the collector.
    - ports:
        - port: 4317
          protocol: TCP

    # Allow HTTP to the three outbound services (Workflow, User Profile,
    # Realm Provisioner) via cluster DNS. Restrict to their default 8080 port;
    # the containing namespaceSelector is unconstrained so this works across
    # the iam namespace and the workflow namespace.
    - ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 8082
          protocol: TCP
        - port: 8083
          protocol: TCP

    {{- with .Values.networkPolicy.additionalEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
