{{- if and .Values.commercialCallers.istio.enabled (or .Values.commercialCallers.enabled .Values.workflowCallers.enabled .Values.signupBffCaller.enabled) }}
{{- if not .Values.commercialCallers.istio.existingCallerNamespaces }}
{{- fail "commercialCallers.istio.existingCallerNamespaces is required when the Istio AuthorizationPolicy renders: it is an ALLOW policy, so every caller not listed (gateway, same-namespace IAM services, monitoring) would be denied." }}
{{- end }}
# CD-19 — Istio AuthorizationPolicy for Commercial domain callers.
#
# This policy grants Billing and Entitlements the minimum path-level access
# they need on Core's internal routes. NetworkPolicy (networkpolicy.yaml)
# enforces L3/L4; this policy adds L7 mTLS identity enforcement.
#
# ALLOW-policy safety (CD-19 alignment rule 3):
#   An Istio ALLOW policy denies every request that matches no rule. The two
#   commercial-caller rules below are scoped to specific paths; without an
#   explicit catch-all for existing callers, the gateway, AuthZ Enrichment,
#   Group Mapping, Audit Log, Tender ACL, Delegation, and every other
#   IAM-internal caller would be silently denied the moment this policy becomes
#   active. The first rule below covers all namespaces already admitted by the
#   base NetworkPolicy ingress rules (set via
#   commercialCallers.istio.existingCallerNamespaces in each env values file).
#   No existing caller loses access.
#
# Prerequisites:
#   - Istio installed in the cluster (istio-system namespace)
#   - PeerAuthentication STRICT mode active in the iam namespace
#   - commercial-billing and commercial-entitlements ServiceAccounts exist
#     in their respective namespaces with Istio sidecar injection enabled
#
# Route definitions (must stay in sync with commercialSystemAllowedRoutes
# in internal/adapter/inbound/http/middleware.go):
#   Billing     → I-11 GET /api/v1/internal/tenants/:id/seat-usage
#               → I-18 GET /api/v1/internal/tenants/:id/plan-change-check
#   Entitlements → I-17 GET /api/v1/internal/tenants/:id/plan-context
#   Workflow    → I-13 POST /api/v1/internal/tenants/:id/tenders/:tender_id/assignee-override
#               → I-15 GET  /api/v1/internal/tenants/:id/members/:user_id/exists
#               → I-19 GET  /api/v1/internal/tenants/:id/members/:user_id/eligibility
#   Signup BFF  → I-1  POST /api/v1/internal/tenants (exact path; bff-signup
#                 ServiceAccount principal only — BFF-1 pod-level admission)
#               → PUB-1 GET /api/v1/public/tenants/resolve (exact; the slug
#                 pre-check before RP-1, BFF open gap A-3)
#
# Path matching: Istio supports only exact, prefix ("abc*"), suffix ("*abc")
# and presence ("*") matches — a "*" in the MIDDLE of a path is literal, so
# the earlier "/api/v1/internal/tenants/*/seat-usage" form never matched and
# denied Billing/Entitlements wherever this policy rendered (prod). Rules now
# use suffix matches. Every suffix below is unique to its internal route,
# except /seat-usage, which also exists as a public /api/v1/tenants/:id route
# — that one is excluded with notPaths. Istio strips the query string before
# matching (I-19's ?department_id=…&required_level=…).
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "iam-org-membership.fullname" . }}-commercial-callers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iam-org-membership.labels" . | nindent 4 }}
  annotations:
    app.kubernetes.io/component: "cd19-commercial-caller-policy"
spec:
  selector:
    matchLabels:
      {{- include "iam-org-membership.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    # Existing callers — namespace-level allow for every caller currently
    # admitted by the base NetworkPolicy ingress rules (gateway, all IAM-internal
    # services sharing the release namespace, and monitoring). No path restriction
    # here: the NetworkPolicy already enforces port-level access, and these callers
    # were unrestricted before CD-19 introduced this ALLOW policy.
    # Populated via commercialCallers.istio.existingCallerNamespaces in each env
    # values file (values-dev.yaml, values-staging.yaml, values-prod.yaml).
    {{- if .Values.commercialCallers.istio.existingCallerNamespaces }}
    - from:
        - source:
            namespaces:
              {{- toYaml .Values.commercialCallers.istio.existingCallerNamespaces | nindent 14 }}
    {{- end }}
    {{- if .Values.commercialCallers.enabled }}
    # Billing (commercial-billing SA) — I-11 and I-18 only.
    - from:
        - source:
            principals:
              - "{{ .Values.commercialCallers.istio.trustDomain }}/ns/{{ .Values.commercialCallers.billing.namespace }}/sa/{{ .Values.commercialCallers.billing.serviceAccountName }}"
      to:
        - operation:
            methods: ["GET"]
            paths:
              - "*/seat-usage"
              - "*/plan-change-check"
            notPaths:
              - "/api/v1/tenants/*"
    # Entitlements (commercial-entitlements SA) — I-17 only.
    - from:
        - source:
            principals:
              - "{{ .Values.commercialCallers.istio.trustDomain }}/ns/{{ .Values.commercialCallers.entitlements.namespace }}/sa/{{ .Values.commercialCallers.entitlements.serviceAccountName }}"
      to:
        - operation:
            methods: ["GET"]
            paths:
              - "*/plan-context"
    {{- end }}
    {{- if .Values.workflowCallers.enabled }}
    # Workflow services (workflow-app) — I-13, I-15 and I-19 only.
    - from:
        - source:
            namespaces:
              - {{ .Values.workflowCallers.namespace | quote }}
      to:
        - operation:
            methods: ["POST"]
            paths: ["*/assignee-override"]
        - operation:
            methods: ["GET"]
            paths: ["*/exists", "*/eligibility"]
    {{- end }}
    {{- if .Values.signupBffCaller.enabled }}
    # Signup BFF (bff-signup SA in bff) — I-1, CR-4's trial-eligibility
    # gate before RP-1, plus PUB-1 for the slug pre-check (BFF open gap A-3). Admitted by principal, not
    # namespace, so no other workload in bff is granted anything (BFF-1).
    - from:
        - source:
            principals:
              - "{{ .Values.commercialCallers.istio.trustDomain }}/ns/{{ .Values.signupBffCaller.namespace }}/sa/{{ .Values.signupBffCaller.serviceAccountName }}"
      to:
        - operation:
            methods: ["POST"]
            paths: ["/api/v1/internal/tenants", "/api/v1/internal/trial-eligibility"]
        - operation:
            methods: ["GET"]
            paths: ["/api/v1/public/tenants/resolve"]
    {{- end }}
{{- end }}
