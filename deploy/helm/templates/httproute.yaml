{{- if and .Values.ingress.enabled (eq (.Values.ingress.type | default "Ingress") "HTTPRoute") }}
# Gateway API HTTPRoute — attach to an Envoy Gateway (or any Gateway API-compatible
# controller) by setting ingress.gateway.name in values.yaml.
#
# TLS termination is configured on the Gateway listener, not here.
# For CORS and gateway-level rate limiting, enable ingress.securityPolicy.
#
# This route (PathPrefix /api/v1) runs under the Gateway-level JWT + ext_authz
# policy. PUB-1 (GET /api/v1/public/tenants/resolve), the one anonymous route,
# is served by its own Exact-match HTTPRoute with a non-merging, rate-limited
# SecurityPolicy when ingress.publicResolve.enabled — see publicresolve.yaml
# for why Gateway API precedence sends that exact GET there and never here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "iam-org-membership.fullname" . }}
  labels:
    {{- include "iam-org-membership.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "ingress.gateway.name is required when ingress.type is HTTPRoute" .Values.ingress.gateway.name }}
      {{- with .Values.ingress.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.ingress.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- if .Values.ingress.hosts }}
  hostnames:
    {{- range .Values.ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- range .paths }}
    - matches:
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path | quote }}
      backendRefs:
        - name: {{ include "iam-org-membership.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
