# Default values for iam-org-membership.
# LLD v2.3 §13 deployment topology (HPA 2-8, 7 CronJobs dispatched by
# cmd/reconciler --job=<name>, 5 metric-exporter goroutines in cmd/server).

replicaCount: 2

image:
  repository: ghcr.io/bcbp-solutions-fzc-llc/iam-org-membership
  pullPolicy: IfNotPresent
  tag: ""  # overridden by CI to the git SHA

imagePullSecrets: []

serviceAccount:
  create: true
  name: iam-org-membership
  # Annotations added to the ServiceAccount — use for IRSA on EKS:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/iam-org-membership
  # When IRSA is configured, remove AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
  # from envFromSecret / secretValues and rely on the pod's ambient IAM role instead.
  annotations: {}

service:
  type: ClusterIP
  port: 8080
  # /metrics is served on its own dedicated port/listener (METRICS_PORT),
  # separate from the API port above — so a NetworkPolicy can grant the
  # monitoring namespace scrape access without also granting it access to
  # the tenant-facing/gateway API surface. Mirrors iam-tender-acl's
  # identical split.
  metricsPort: 9090

# HPA — LLD §13.1, HPA 2-8 replicas.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  targetRPSPerReplica: 500

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Non-secret env — mirrors .env-example. Anything with a URL/ARN/credential
# lives in envFromSecret below.
env:
  # The service label on every metric and span (gincommon.Config.ServiceName
  # / TracingConfig.ServiceName, set from APP_NAME in both binaries). The one
  # source of the service name — OTEL_SERVICE_NAME is not read.
  APP_NAME: "iam-org-membership"
  # APP_ENV is also the observability environment label: it must be one of
  # local|dev|test|staging|prod (no aliases — "production" fails startup).
  APP_ENV: "prod"
  # Observability Standard domain (gincommon/pgcommon/events const label).
  # Also set in code (gincommon.Config.Domain); startup fails without one.
  OBSERVABILITY_DOMAIN: "iam"
  APP_PORT: "8080"
  METRICS_PORT: "9090"

  # Postgres (LLD §4.4). Host/user/dbname wire in at deploy time; PG_SSLMODE
  # stays "require" in prod.
  PG_HOST: ""
  PG_PORT: "5432"
  PG_USER: "org_membership_app"
  PG_DBNAME: "org_membership"
  PG_SSLMODE: "require"
  PG_MAX_CONNS: "20"
  PG_MIN_CONNS: "0"
  PG_BOUNCER_MODE: "true"
  PG_SLOW_QUERY_THRESHOLD: "200ms"
  PG_STATEMENT_TIMEOUT: "5s"
  # Bounds a row-lock wait (TM-13 / SEAT-1 SELECT … FOR UPDATE) so it
  # surfaces as 503 request_timeout (55P03) instead of burning the whole
  # statement timeout.
  PG_LOCK_TIMEOUT: "2s"
  # Reconciler CronJobs share this env; their batch sweeps get their own
  # per-statement bound instead of the API's 5s.
  RECONCILER_STATEMENT_TIMEOUT: "120s"

  # AWS region / Glue registry names (ARNs live in secret refs).
  AWS_REGION: "ap-south-1"
  GLUE_REGISTRY_MEMBERSHIP_NAME: "iam-membership-events"
  GLUE_REGISTRY_TENANT_NAME: "iam-tenant-events"

  # Outbox runner (§7.3, transactional outbox).
  OUTBOX_POLL_INTERVAL: "500ms"
  OUTBOX_BATCH_SIZE: "50"
  OUTBOX_MAX_ATTEMPTS: "5"
  OUTBOX_DRAIN_TIMEOUT: "30s"
  # SQS consumers (platform-events). Drain runs in parallel with the HTTP
  # drain at shutdown; the handler timeout stays below the 30s visibility.
  SQS_DRAIN_TIMEOUT: "15s"
  SQS_HANDLER_TIMEOUT: "20s"
  # platform_queue_depth / platform_dlq_depth sampling (IAMOrgMembershipDLQBacklog).
  SQS_QUEUE_DEPTH_INTERVAL: "60s"
  OUTBOX_PUBLISH_CONCURRENCY: "4"
  OUTBOX_PUBLISH_TIMEOUT: "10s"
  OUTBOX_STARTUP_JITTER: "2s"
  OUTBOX_CLAIM_LEASE_DURATION: "10m"

  # processed_events retention (PE-1 strictly > 7-day SQS lifetime, IDEMP-4).
  PROCESSED_EVENTS_TTL_DAYS: "8"

  # Business timers (LLD §12).
  INVITATION_EXPIRY_DAYS: "7"
  SEAT_OVERAGE_GRACE_DAYS: "30"
  # CD-23: grace before cancelled → suspended (30 days). Must equal RP
  # CANCELLED_GRACE_DAYS. RP offboards at suspended + 60 days (90 days total
  # from cancellation). Do NOT change without a joint RP + Core release.
  SUBSCRIPTION_GRACE_DAYS: "30"
  MAX_LIFECYCLE_EVENT_SKEW_SECONDS: "300"
  INVITE_REINVITE_COOLDOWN_MINUTES: "15"
  INVITE_MAX_PER_TENANT_PER_HOUR: "60"

  # Outbound service clients (LLD §18). Fail-open where noted in CLAUDE.md.
  WORKFLOW_SERVICE_BASE_URL: ""
  WORKFLOW_TIMEOUT_MS: "3000"
  REALM_PROVISIONER_BASE_URL: ""
  REALM_PROVISIONER_TIMEOUT_MS: "3000"
  # catalog-admin-config — NOT fail-open, unlike the three clients above:
  # this service is now the sole system of record for departments/plans
  # (migration Phase 4/Contract complete, no local fallback table exists
  # anymore). An unset CATALOG_ADMIN_BASE_URL returns a plain error from
  # both client methods (internal/adapter/outbound/catalogadmin/http_client.go)
  # rather than degrading gracefully — this value is load-bearing.
  CATALOG_ADMIN_BASE_URL: ""
  CATALOG_ADMIN_TIMEOUT_MS: "3000"
  # group-mapping (ADR-0007 Wave 2) — fails open on I-10 JIT resolution;
  # see internal/adapter/outbound/groupmappingclient.
  GROUP_MAPPING_BASE_URL: ""
  GROUP_MAPPING_TIMEOUT_MS: "300"
  # delegation (ADR-0008 v2) — fails open on the §8.8.4 dept-scope
  # pre-filter, degrading to tenant-wide delegate-impact scoping; see
  # internal/adapter/outbound/delegationcheck. Gap-8 fix (2026-09-17) raised
  # the code default from 300ms to 1000ms — 300ms was too tight under load
  # or cold-start; this value was left stale at the old default, which would
  # have silently overridden the fix on every real deploy. Corrected here.
  # DLG-OM-GAP-001: set to http://iam-delegation.iam.svc.cluster.local:8080
  # in staging/prod. Without it, dept-scope precision on admin removal path
  # (§8.8.4) permanently degrades to tenant-wide scoping (never a hard fail).
  DELEGATION_BASE_URL: ""
  DELEGATION_TIMEOUT_MS: "1000"
  # token-service (AUTH-9/IB-3) — fails open on the membership-create
  # (P-6/I-3) and role-grant (P-10/P-28) service-account-not-grantable
  # check; the primary guarantee is structural (composite FK bar, TR-8/
  # DM-4), so an unset/unreachable value just degrades to allowing the
  # operation. See internal/adapter/outbound/tokenservice.
  TOKEN_SERVICE_BASE_URL: ""
  TOKEN_SERVICE_TIMEOUT_MS: "1000"

  # iam-audit-log — AL-5 direct-write for config.tenant_setting.changed,
  # invitation.created/revoked/expired (D-6 subset). Calls are best-effort
  # and fail-open: P-2 and invite flows always succeed even if this is unset
  # or unreachable. Unset logs a WARN at startup (AUDIT_LOG_BASE_URL warning)
  # and skips all AL-5 writes silently — set in staging/prod so audit records
  # reach iam-audit-log. Sustained failures surface on the
  # IAMAuditDeliveryFailed alert (iam_org_membership_audit_delivery_failed_total).
  AUDIT_LOG_BASE_URL: ""
  AUDIT_LOG_TIMEOUT_MS: "3000"

  # OpenTelemetry — read by platform-gincommon (InitTracingWithConfig takes
  # the identity from code, the exporter and sampler from here).
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.observability.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_INSECURE: "false"
  # Head sampling ratio in [0,1] (gincommon's default outside dev is 0.1).
  OTEL_TRACES_SAMPLER_RATIO: "0.1"
  # W3C baggage propagation (off).
  OTEL_PROPAGATOR_BAGGAGE: "false"
  # false: a sampled remote parent (the gateway / an upstream service) keeps
  # its trace whole. Edge services that accept untrusted traceparent set true.
  OTEL_TRACES_IGNORE_REMOTE_PARENT_SAMPLED: "false"

  # Logging — read by platform-gincommon's logger (all binaries).
  LOG_LEVEL: "info"          # debug | info | warn | error
  LOG_SAMPLING: "false"      # zap sampling of repetitive entries

  # Reconciler CronJobs are never scraped; each run pushes its metrics here
  # (grouped by cronjob). Empty skips the push.
  PROMETHEUS_PUSHGATEWAY_URL: ""

  # Docs surface (optional).
  DOCS_ENABLED: "false"

# Env vars whose value comes from a Kubernetes Secret. Keys must be present
# in either .Values.existingSecret or .Values.secretValues.
envFromSecret:
  - DATABASE_URL
  - MIGRATION_DATABASE_URL
  - SYSTEM_DATABASE_URL
  - VALKEY_URL
  - SNS_TOPIC_MEMBERSHIP_ARN
  - SNS_TOPIC_TENANT_ARN
  - SQS_TENANT_ORGM_QUEUE_URL
  - SQS_BILLING_ORGM_QUEUE_URL
  # CAT-GAP-005: CatalogConsumer polls this queue for DepartmentCatalogChanged
  # events. Set to the catalog-orgm-q ARN. When unset the consumer goroutine
  # never starts and om:departments cache is TTL-invalidated only (11-min worst case).
  - SQS_CATALOG_ORGM_QUEUE_URL
  # Dedicated queue for PlanCatalogChanged with feature_set propagation. On receipt,
  # merges the plan's new feature_set into tenants.feature_flags for all active tenants
  # on the affected plan (sysPool BYPASSRLS) and evicts om:tenant caches.
  # Set to the catalog-orgm-plans-q ARN. When unset, plan feature_set changes
  # only clear the om:plans cache (TTL-based propagation, up to 600 s lag).
  - SQS_CATALOG_ORGM_PLANS_QUEUE_URL
  - GLUE_REGISTRY_MEMBERSHIP_ARN
  - GLUE_REGISTRY_TENANT_ARN
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - DOCS_AUTH_TOKEN

# existingSecret — preferred for production.
# Set to the name of a pre-existing Kubernetes Secret whose keys match envFromSecret.
# When set, the chart will NOT create a Secret resource; secretValues is ignored.
# Use with External Secrets Operator, AWS Secrets Manager CSI, or Sealed Secrets:
#   existingSecret: "iam-org-membership-secrets"
existingSecret: ""

# rotationEpoch — used only when existingSecret is set.
# Bump this value to trigger a rolling restart after an external secret is rotated:
#   helm upgrade ... --set rotationEpoch=$(date +%s)
rotationEpoch: "0"

# Secret values — used ONLY when existingSecret is empty.
# Pass via --set or a Helm secrets plugin (never commit real values).
# Warning: Helm stores these in the release history Secret (base64, not encrypted).
# In production, always prefer existingSecret over this map.
secretValues:
  DATABASE_URL: ""
  MIGRATION_DATABASE_URL: ""
  SYSTEM_DATABASE_URL: ""
  VALKEY_URL: ""
  SNS_TOPIC_MEMBERSHIP_ARN: ""
  SNS_TOPIC_TENANT_ARN: ""
  SQS_TENANT_ORGM_QUEUE_URL: ""
  SQS_BILLING_ORGM_QUEUE_URL: ""
  SQS_CATALOG_ORGM_QUEUE_URL: ""
  SQS_CATALOG_ORGM_PLANS_QUEUE_URL: ""
  GLUE_REGISTRY_MEMBERSHIP_ARN: ""
  GLUE_REGISTRY_TENANT_ARN: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  DOCS_AUTH_TOKEN: ""

terminationGracePeriodSeconds: 75   # max(30 s HTTP drain, 15 s SQS drain, in parallel) + 30 s outbox drain + 10 s pool drain + 5 s buffer

# podDisruptionBudget — ensures at least 1 pod survives voluntary disruptions
# (node drains, cluster upgrades). With minReplicas: 2 we keep minAvailable=1
# so a single node drain doesn't take the service to zero.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532      # distroless nonroot UID
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []

# startupProbe covers the migration window on cold start / schema upgrades.
# Once it passes, liveness and readiness take over. failureThreshold * periodSeconds
# = 120 s maximum startup budget (migrations rarely exceed 30 s in practice).
startupProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 24   # 24 × 5 s = 120 s startup budget
  timeoutSeconds: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 0   # startupProbe handles the initial delay
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 3

# CronJobs — 7 reconcilers per LLD §13.1 (exporters run as goroutines in
# cmd/server/main.go per our Option A decision, not as CronJobs). Each entry
# dispatches the same reconciler binary with a different --job flag.
# See templates/cronjobs.yaml.
# Schema migrations: a pre-install / pre-upgrade hook Job (cmd/migrate) runs
# them once per release; the Deployment runs with RUN_MIGRATIONS=false.
migrations:
  job:
    enabled: true
    backoffLimit: 1
    timeout: "10m"              # MIGRATE_TIMEOUT, lock wait included
    activeDeadlineSeconds: 900  # > timeout

cronjobs:
  invitation-expiry:
    schedule: "*/5 * * * *"
    job: invitation-expiry
  invitation-kc-cleanup:
    schedule: "*/10 * * * *"
    job: invitation-kc-cleanup
  realm-config-sync:
    schedule: "*/10 * * * *"
    job: realm-config-sync
  seat-overage-reconcile:
    schedule: "0 */6 * * *"
    job: seat-overage-reconcile
  trial-cleanup:
    schedule: "0 2 * * *"
    job: trial-cleanup
  outbox-prune:
    schedule: "0 3 * * *"
    job: outbox-prune
  processed-events-prune:
    schedule: "0 4 * * *"
    job: processed-events-prune

# NetworkPolicy — enabled by default. Restricts traffic to the ingress
# controller / gateway namespace and the monitoring namespace (/metrics).
# Egress permits Postgres/Valkey/AWS(443)/OTel and the three outbound
# services (Workflow, User Profile, Realm Provisioner) via cluster DNS.
networkPolicy:
  enabled: true
  ingressControllerNamespaceSelector:
    kubernetes.io/metadata.name: gateway
  ingressControllerPodSelector: {}
  metricsIngress:
    enabled: true
    namespaceSelector:
      kubernetes.io/metadata.name: observability
    podSelector:
      app.kubernetes.io/name: prometheus
  # TAC-GAP-010 / EC-OM-GAP-003: explicit ingress rules for services that call
  # internal endpoints (I-15 from iam-tender-acl; I-3/I-4/I-5/I-10 from
  # iam-event-consumer). The existing `podSelector: {}` rule already admits all
  # same-namespace pods; these named rules are explicit documentation and ensure
  # correctness if pods move to dedicated namespaces in future.
  additionalIngressRules:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: iam-tender-acl
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: iam-event-consumer
      ports:
        - port: 8080
          protocol: TCP
  additionalEgressRules: []

# Tenant binding on /api/v1/internal/tenants/:id/* (BindPathTenant). The
# path tenant is always authoritative. strictTenantPathValidation decides
# what happens when a caller's x-tenant-id differs from it:
#   false (default) — override with the path tenant, log
#                     tenant_header_path_mismatch, count
#                     iam_org_membership_tenant_header_path_mismatch_total
#   true            — reject with 400 TENANT_MISMATCH (RFC 9457) before the
#                     handler runs
# Rollout: keep false, watch the mismatch counter per route in every
# environment, fix any caller that shows up, then enable per environment
# (dev → staging → prod) once the counter has stayed at zero.
iam:
  strictTenantPathValidation: false

# CD-19 — Commercial domain callers.
# Feature-gates both the NetworkPolicy ingress rules and the Istio
# AuthorizationPolicy that restrict which Commercial services can reach
# which internal routes on Core.
#
# Workflow services (Definition and Execution, namespace workflow-app — the
# platform namespace list in docs/HLD/aws-dev-environment-ap-south-1.md and the
# Workflow LLDs §11.1) call I-13 (assignee override), I-15 (membership
# exists) and I-19 (assignee eligibility). They run outside this release's
# namespace, so the same-namespace rule never admitted them.
#   - NetworkPolicy: admits workflow-app (optionally narrowed by
#     podSelector) to the API port whenever enabled. NetworkPolicy is L4, so
#     without the mesh the only gate on every other internal route is the
#     iam-system x-tenant-roles header — the same posture as same-namespace
#     callers today.
#   - Istio AuthorizationPolicy (commercialCallers.istio.enabled): a rule for
#     source namespace workflow-app limited to POST */assignee-override and
#     GET */exists, */eligibility (suffix match; each suffix is unique to its
#     internal route, and Istio ignores the query string).
workflowCallers:
  enabled: true
  namespace: workflow-app
  namespaceSelector:
    kubernetes.io/metadata.name: workflow-app
  podSelector: {}   # {} = any Workflow pod in that namespace

# Signup BFF (Signup BFF decision BFF-1 / C-5) — the one public-facing caller
# of an internal route. It calls only I-1 (POST /api/v1/internal/tenants) —
# plus PUB-1 (GET /api/v1/public/tenants/resolve) server-side, as the slug
# pre-check before RP-1 (BFF open gap A-3) — and
# runs in its own namespace (bff), never in iam. Admission is per pod, not per
# namespace, so a future service placed in bff gets nothing without its own
# explicit grant:
#   - NetworkPolicy: admits only pods matching podSelector in the bff
#     namespace to the API port. podSelector is required — an empty selector
#     would admit the whole namespace, so the chart fails instead.
#   - Istio AuthorizationPolicy (commercialCallers.istio.enabled): a rule for
#     the bff-signup ServiceAccount's SPIFFE principal, limited to the exact
#     paths POST /api/v1/internal/tenants and GET /api/v1/public/tenants/resolve.
# podSelector must match the labels on the bff-signup pods (the
# BCBP-SOLUTIONS-FZC-LLC/bff-signup chart).
signupBffCaller:
  enabled: true
  namespace: bff
  serviceAccountName: bff-signup
  namespaceSelector:
    kubernetes.io/metadata.name: bff
  podSelector:
    app.kubernetes.io/name: bff-signup

# Default false — override to true in each env values file (values-dev.yaml,
# values-staging.yaml, values-prod.yaml) that should admit Commercial callers.
# Set commercialCallers.istio.enabled=true only when Istio (service mesh)
# is confirmed in the cluster — the NetworkPolicy is always enforced regardless.
commercialCallers:
  enabled: false          # base default; set true per-env in values-{dev,staging,prod}.yaml

  # Billing Service (namespace "billing", SA "commercial-billing").
  # Allowed routes (NetworkPolicy + Istio): I-11 seat-usage, I-18 plan-change-check.
  billing:
    namespace: billing
    serviceAccountName: commercial-billing
    # Label selectors for the NetworkPolicy (namespaceSelector + podSelector).
    namespaceSelector:
      kubernetes.io/metadata.name: billing
    podSelector:
      app.kubernetes.io/name: commercial-billing

  # Entitlements Service (namespace "commercial", SA "commercial-entitlements").
  # Allowed route (NetworkPolicy + Istio): I-17 plan-context.
  entitlements:
    namespace: commercial
    serviceAccountName: commercial-entitlements
    namespaceSelector:
      kubernetes.io/metadata.name: commercial
    podSelector:
      app.kubernetes.io/name: commercial-entitlements

  # Istio AuthorizationPolicy — only render when the service mesh is present.
  # The NetworkPolicy above enforces L3/L4; AuthorizationPolicy adds L7 mTLS
  # identity enforcement. Both should be enabled in production.
  #
  # ALLOW-policy safety: an Istio ALLOW policy denies every request that matches
  # no rule. existingCallerNamespaces lists the namespaces that the base
  # NetworkPolicy already admits (gateway, IAM-internal services, monitoring) so
  # they are explicitly allowed here and do not lose access when commercial rules
  # are added. Set this per-env in values-{dev,staging,prod}.yaml.
  istio:
    enabled: false   # set true once Istio is confirmed in the cluster
    # SPIFFE principal prefix — cluster.local is the default Istio trust domain.
    trustDomain: cluster.local
    # Namespaces already admitted by the base NetworkPolicy ingress rules.
    # Required for ALLOW-policy safety — see authorizationpolicy.yaml comment.
    existingCallerNamespaces: []

# ServiceMonitor — requires kube-prometheus-stack (monitoring.coreos.com/v1 CRD).
# Enable to have Prometheus auto-discover and scrape /metrics.
# NOTE: PrometheusRule (alerting rules) is also gated on this flag — no scrape
# means no metrics, which means all alerts stay permanently inactive. Set to
# true (and add the correct serviceMonitorSelector labels) before relying on
# any alert in deploy/monitoring/ or deploy/helm/templates/prometheusrule.yaml.
serviceMonitor:
  enabled: true
  interval: "30s"
  scrapeTimeout: "10s"
  additionalLabels: {}
  relabelings: []
  namespaceSelector: {}

# Ingress — disabled by default.
# type: HTTPRoute  — Envoy Gateway / any Gateway API-compatible controller (recommended)
# type: Ingress    — classic nginx / traefik Ingress controller
ingress:
  enabled: false
  type: HTTPRoute

  hosts:
    - host: iam-org-membership.internal.example.com
      paths:
        - path: /api/v1
          pathType: PathPrefix

  # Gateway API (type: HTTPRoute) — reference the Gateway resource that
  # Envoy Gateway manages. Deploy the Gateway separately.
  gateway:
    name: ""              # required — name of the Gateway resource
    namespace: ""         # optional — defaults to the release namespace
    sectionName: ""       # optional — target a specific listener (e.g. "https")

  # Envoy Gateway SecurityPolicy — CORS and gateway-level rate limiting.
  # Requires gateway.envoyproxy.io/v1alpha1 CRD (Envoy Gateway v1.8+ for mergeType).
  # The in-process per-user token-bucket limiter remains active in all cases.
  securityPolicy:
    enabled: false
    # Merge this route policy with the Gateway-level SecurityPolicy instead of
    # replacing it, so the gateway's JWT + ext_authz (AuthZ Enrichment's
    # trusted identity headers) stay in force on these routes. StrategicMerge |
    # JSONMerge; requires Envoy Gateway >= v1.8. Set "" only on an older
    # gateway (where the unknown field would be pruned or rejected) — and on
    # such a gateway do not enable this policy at all: it would replace the
    # gateway policy.
    mergeType: StrategicMerge
    cors:
      enabled: false
      allowOrigins: []
      allowMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowHeaders:
        - Authorization
        - Content-Type
        - X-Tenant-ID
        - X-User-ID
        - X-Idempotency-Key
      maxAge: "86400"
    rateLimit:
      enabled: false
      requestsPerUnit: 1000
      unit: Second          # Second | Minute | Hour

  # Classic Ingress (type: Ingress)
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  tls: []
  #  - secretName: iam-org-membership-tls
  #    hosts:
  #      - iam-org-membership.internal.example.com
