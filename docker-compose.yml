services:
  app:
    build:
      context: .
      secrets:
        - go_private_token
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      APP_ENV: dev
      APP_PORT: "8080"
      METRICS_PORT: "9090"
      APP_NAME: iam-org-membership
      PG_HOST: pgbouncer
      PG_PORT: "5432"
      PG_USER: org_membership_app
      PG_PASSWORD: devpassword
      PG_DBNAME: org_membership
      PG_SSLMODE: disable
      PG_MAX_CONNS: "20"
      PG_MIN_CONNS: "0"
      PG_BOUNCER_MODE: "true"
      MIGRATION_DATABASE_URL: postgres://org_membership_app:devpassword@postgres:5432/org_membership?sslmode=disable
      VALKEY_URL: redis:6379
      SNS_TOPIC_MEMBERSHIP_ARN: arn:aws:sns:ap-south-1:000000000000:iam-membership-events
      SNS_TOPIC_TENANT_ARN: arn:aws:sns:ap-south-1:000000000000:iam-tenant-events
      SQS_TENANT_ORGM_QUEUE_URL: http://floci:4566/000000000000/tenant-orgm-q
      SQS_BILLING_ORGM_QUEUE_URL: http://floci:4566/000000000000/billing-orgm-q
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://floci:4566
      # Glue Schema Registry (LLD §7.3.1, SCHEMA-7) — one registry per SNS
      # topic. Floci provisions both registries + all 14 schemas on start via
      # scripts/init-floci.sh, so the real GlueCodec wire format runs locally
      # instead of falling back to NoopCodec (Floci includes Glue Schema
      # Registry in its free tier, unlike LocalStack Community which gated
      # it behind Pro).
      GLUE_REGISTRY_MEMBERSHIP_NAME: iam-membership-events
      GLUE_REGISTRY_MEMBERSHIP_ARN: arn:aws:glue:ap-south-1:000000000000:registry/iam-membership-events
      GLUE_REGISTRY_TENANT_NAME: iam-tenant-events
      GLUE_REGISTRY_TENANT_ARN: arn:aws:glue:ap-south-1:000000000000:registry/iam-tenant-events
      OUTBOX_POLL_INTERVAL: 500ms
      OUTBOX_BATCH_SIZE: "50"
      OUTBOX_MAX_ATTEMPTS: "5"
      OUTBOX_DRAIN_TIMEOUT: 30s
      OUTBOX_PUBLISH_CONCURRENCY: "4"
      OUTBOX_PUBLISH_TIMEOUT: 10s
      OUTBOX_STARTUP_JITTER: 2s
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      floci:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: org_membership_app
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: org_membership
    ports:
      # Host 5534 → container 5432. 5434 is claimed by iam-user-profile2's
      # postgres so both services can run side-by-side on the host.
      - "5534:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U org_membership_app -d org_membership"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    ports:
      # Host 6380 → container 6379. 6379 is claimed by iam-user-profile2's
      # Valkey so both services can run side-by-side.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      # Host 5533 → container 5432. 5433 is claimed by iam-user-profile2's
      # PgBouncer so both services can run side-by-side.
      - "5533:5432"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: org_membership_app
      DB_PASSWORD: devpassword
      DB_NAME: org_membership
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 5
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      SERVER_TLS_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U org_membership_app || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  floci:
    # Floci — open-source (MIT), always-free AWS emulator; drop-in LocalStack
    # replacement. Unlike LocalStack Community, Glue Schema Registry ships in
    # the free tier, so this single service covers SNS + SQS + Glue with no
    # Pro tier / auth token needed — scripts/init-floci.sh provisions both
    # Glue registries and all 14 schemas alongside the SNS/SQS topology.
    image: floci/floci:2.1.0-compat
    ports:
      # Host 4567 → container 4566. 4566 is claimed by iam-user-profile2's
      # own emulator instance so both services can run side-by-side.
      - "4567:4566"
    environment:
      FLOCI_DEFAULT_REGION: ap-south-1
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      # Rewrites the host in SQS QueueUrl / SNS TopicArn responses (e.g.
      # http://floci:4566/... instead of http://localhost:4566/...) so the
      # floci-ui container below — which resolves those URLs directly,
      # AWS-SDK-console fashion — can actually reach them from inside its
      # own container. Without this, floci-ui's queue list loads fine but
      # every per-queue attribute (message counts included) silently comes
      # back empty.
      FLOCI_HOSTNAME: floci
      # init-floci.sh makes ~50 sequential aws CLI round-trips (3 topics, 20
      # queues, 10 subscriptions, 2 registries, 14 schemas); floci's default
      # 30s ready-hook timeout is right at that edge on a busy host and was
      # observed to trip it. Give real headroom.
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: "90"
    volumes:
      - floci_data:/app/data
      - ./scripts/init-floci.sh:/etc/floci/init/ready.d/init-floci.sh
      - ./internal/adapter/outbound/eventbus/schemas:/etc/floci/init/schemas:ro
    healthcheck:
      # The compat image's AWS CLI defaults to region us-east-1 regardless of
      # FLOCI_DEFAULT_REGION — floci treats region as an isolation boundary
      # (a topic created in ap-south-1 is invisible to an unscoped/us-east-1
      # call), so --region must be explicit here.
      #
      # Checks for the LAST resource init-floci.sh creates (the TrialStarted
      # Glue schema), not just SNS reachability — SNS topics exist ~10s into
      # the script while Glue registration is still running, so a shallow
      # `sns list-topics` check would report "healthy" (and unblock `app`'s
      # depends_on) before GLUE_REGISTRY_*_NAME's schemas actually exist,
      # crashing GlueCodec's startup prefetch.
      test: ["CMD", "aws", "--region", "ap-south-1", "glue", "get-schema",
             "--schema-id", "RegistryName=iam-tenant-events,SchemaName=TrialStarted"]
      interval: 5s
      timeout: 5s
      retries: 20

  floci-ui:
    # Web console for floci — browse SNS/SQS/Glue resources at
    # http://localhost:4500 instead of the aws CLI. Talks to `floci` over
    # the compose network. Shows queue/topic metadata including live message
    # counts — good for visually confirming an event landed in the right
    # queue — but does not (yet) show message bodies or SNS
    # topics/subscriptions; use the CLI cookbook in test.md for that.
    image: floci/floci-ui:0.5.0
    ports:
      - "4500:4500"
    environment:
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      # NOT the same as AWS_ENDPOINT_URL below. The AWS SDK clients that
      # actually list/describe resources pick AWS_ENDPOINT_URL up on their
      # own (standard SDK env support), but floci-ui's own connectivity
      # probe and "Connected"/"Not connected" banner read this separate,
      # floci-ui-specific var (packages/api/src/service/runtimeProbe.ts
      # upstream: `process.env.FLOCI_ENDPOINT ?? 'http://localhost:4566'`).
      # Leaving it unset makes the console probe localhost:4566 from
      # *inside its own container* — itself, not `floci` — so it always
      # shows "Not connected http://localhost:4566" regardless of whether
      # resource listing actually works.
      FLOCI_ENDPOINT: http://floci:4566
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://floci:4566
      PORT: "4500"
    depends_on:
      floci:
        condition: service_healthy

volumes:
  postgres_data:
  floci_data:

secrets:
  go_private_token:
    file: .go_private_token
