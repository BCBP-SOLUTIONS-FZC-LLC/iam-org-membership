  # ── Inbound operations — the three queues this service consumes (§7.1) ─────
  consumeTenantOrgm:
    action: receive
    channel:
      $ref: '#/channels/tenantOrgmQueue'
    tags:
      - $ref: '#/components/tags/consumed'
    summary: Consume Realm Provisioner tenant-lifecycle events — drives the tenants projection
    description: |
      Consumer: this service (iam-org-membership)
      Producer: Realm Provisioner
      Queue   : tenant-orgm-q  |  DLQ: tenant-orgm-q-dlq
      Filter  : EventType IN [TrialTenantProvisioned, TenantRealmReady,
                              TenantConverted, DirectPaidSignup, TrialExpired,
                              TrialReactivated, TenantSuspended, TenantOffboarded,
                              TenantReactivated]

      TenantReactivated on this queue (new — resolves F1 of the RP↔O&M
      alignment review) carries source=operator: RP emits it to reverse an
      operator-sourced suspension (RP-10 undoing RP-14, T-16). It is handled
      by the exact same case in applyProjection as the billing-orgm-q
      TenantReactivated below — the handler reads no payload fields and
      derives the target status (active vs trial) from the tenants row's
      own subscription_started_at, so it behaves identically regardless of
      which topic/producer delivered it. EVT-14 recency ordering is keyed
      on tenants.last_event_at under the row lock, so the two producers
      (Billing on billing-orgm-q, RP on tenant-orgm-q) interleave safely —
      the newest producer-stamped event always wins, same guarantee as
      every other dual-producer-adjacent case in this consumer.

      This is a consume-side reaction, not a request/response call. Every
      message is handled by the single MembershipEventConsumer.Handle entry
      point (internal/adapter/inbound/consumer/membership_event_consumer.go),
      which applies, in order:
        1. EVT-15 future-time clamp — event.time > now() + skew (default
           MAX_LIFECYCLE_EVENT_SKEW_SECONDS=300) → rejected to DLQ, never
           recorded in processed_events (poison-pill guard).
        2. Dedup probe against processed_events (event_id, consumer=
           "iam-org-membership") — a hit is a silent no-op.
        3. SELECT ... FOR UPDATE on the tenants row, then EVT-14 recency
           guard — event.time <= tenants.last_event_at skips the projection
           but still records processed_events (stale/reordered delivery).
        4. Per-type projection (see each message's own summary for the exact
           tenants columns it mutates).
        5. EVT-16 relay — if the projection changed tenants.status or
           tenants.plan, enqueue TenantStateChanged onto iam-membership-events
           in the same tx.
        6. If the projection transitioned the tenant into offboarded,
           additionally enqueue TenantMembershipsPurged onto
           iam-membership-events so Delegation/Tender-ACL/Group-Mapping can
           run their own tenant-scoped cascade-deletes (§16 OQ-1: this is
           never a re-emission of Realm Provisioner's own TenantOffboarded
           under the same or a different name — one producer per event name).

      An event type not in the nine above (and not one of the five
      billing-orgm-q types) is classified kindUnknown and silently
      acknowledged (processed_events recorded, no projection applied),
      counted by iam_org_membership_unknown_event_acknowledged_total — this is deliberate
      forward-compatibility so a Realm Provisioner schema addition never
      triggers a DLQ storm here.

      Idempotency key: (id, consumer="iam-org-membership") in
      processed_events — both inbound queues share this one consumer
      identity (see consumerName in membership_event_consumer.go).
    messages:
      - $ref: '#/channels/tenantOrgmQueue/messages/TrialTenantProvisioned'
      - $ref: '#/channels/tenantOrgmQueue/messages/TenantRealmReady'
      - $ref: '#/channels/tenantOrgmQueue/messages/TenantConverted'
      - $ref: '#/channels/tenantOrgmQueue/messages/DirectPaidSignup'
      - $ref: '#/channels/tenantOrgmQueue/messages/TrialExpired'
      - $ref: '#/channels/tenantOrgmQueue/messages/TrialReactivated'
      - $ref: '#/channels/tenantOrgmQueue/messages/TenantSuspended'
      - $ref: '#/channels/tenantOrgmQueue/messages/TenantOffboarded'
      - $ref: '#/channels/tenantOrgmQueue/messages/TenantReactivated'

  consumeBillingOrgm:
    action: receive
    channel:
      $ref: '#/channels/billingOrgmQueue'
    tags:
      - $ref: '#/components/tags/consumed'
    summary: Consume Billing events — drives the tenants plan/status/seats projection
    description: |
      Consumer: this service (iam-org-membership)
      Producer: Billing Service
      Queue   : billing-orgm-q  |  DLQ: billing-orgm-q-dlq
      Filter  : EventType IN [TenantPlanChanged, TenantPaymentPastDue,
                              TenantSubscriptionCancelled, TenantReactivated,
                              TenantSeatsChanged]

      Handled by the same MembershipEventConsumer.Handle entry point, and
      the same EVT-14/EVT-15/EVT-16/TenantMembershipsPurged sequence,
      documented on consumeTenantOrgm above — the two queues are
      distinguished only by which producer they came from and which
      tenants columns their projections touch (see each message's own
      summary).

      Idempotency key: (id, consumer="iam-org-membership") in
      processed_events — shared with consumeTenantOrgm.
    messages:
      - $ref: '#/channels/billingOrgmQueue/messages/TenantPlanChanged'
      - $ref: '#/channels/billingOrgmQueue/messages/TenantPaymentPastDue'
      - $ref: '#/channels/billingOrgmQueue/messages/TenantSubscriptionCancelled'
      - $ref: '#/channels/billingOrgmQueue/messages/TenantReactivated'
      - $ref: '#/channels/billingOrgmQueue/messages/TenantSeatsChanged'

  consumeCatalogOrgm:
    action: receive
    channel:
      $ref: '#/channels/catalogOrgmQueue'
    tags:
      - $ref: '#/components/tags/consumed'
    summary: Consume Catalog Service department-catalog-change events (Gap 12) — inert, no live producer yet
    description: |
      Consumer: this service (iam-org-membership), catalog_consumer.go
      Producer: Catalog / Admin Config Service (iam-catalog-admin) — NOT YET BUILT
      Queue   : catalog-orgm-q  |  DLQ: catalog-orgm-q-dlq
      Filter  : EventType IN [DepartmentCatalogChanged]

