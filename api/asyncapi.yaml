      summary: |
        Consumed by this service, not published. Sets tenants.status=
        'suspended' and tenants.suspension_source from payload.source
        (default 'billing_lapse' if absent — backward-compatible with
        producers that predate the operator-suspension path, LLD T-16 /
        resolves RP-11). On 'billing_lapse' also sets tenants.cancelled_at
        =COALESCE(cancelled_at, now()) (T-11: cancelled_at IS NOT NULL iff
        status IN (cancelled, offboarded), or suspended+billing_lapse —
        COALESCE keeps an idempotent replay from resetting an already-set
        timestamp). On 'operator' (RP-14, an administrative suspension that
        can land directly on active/trial, skipping the grace path)
        cancelled_at is deliberately left untouched, so the tenant never
        enters the §15.5 grace/retention clock it was never billing-lapsed
        into. Confirmed by RP (LLD §16 OQ-7): `source` is present on every
        occurrence — RP's lapse sweep (RP-C3) sends `billing_lapse`
        explicitly, RP-14 sends `operator` — matching this schema's enum
        verbatim. The "default to 'billing_lapse' if absent" behavior is
        a defensive fallback only; RP never relies on it.
