        Consumed by this service, not published. Sets tenants.status=
        'cancelled' and tenants.cancelled_at=COALESCE(cancelled_at, now())
        together in the same UPDATE (T-11 biconditional; COALESCE preserves
        an existing timestamp on idempotent replay, e.g. a tenant that was
