        This event was previously named TenantOffboarded and routed on
        iam-tenant-events; that was wrong, because TenantOffboarded is the
        Realm-Provisioner-produced terminal tenant event Core only
        *consumes* (via tenant-orgm-q — the case "TenantOffboarded":
        dispatch in membership_event_consumer.go's inbound switch is
        completely unchanged by this rename), never produces — having Core
        also emit an event of the same name would violate "one producer
        per event name". This pass renames Core's own outbound relay to
        TenantMembershipsPurged and moves it here, to
        iam-membership-events; it is never a re-emission of RP's
        TenantOffboarded.
