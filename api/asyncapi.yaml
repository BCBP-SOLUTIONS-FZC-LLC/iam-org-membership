      Filter  : EventType IN [DepartmentMembershipGranted,
                              DepartmentMembershipLevelChanged,
                              TenantRoleGranted, TenantRoleRevoked]

      On DepartmentMembershipGranted at reviewer/approver level: add the
        requires-mfa realm role to the user in Keycloak.
      On DepartmentMembershipLevelChanged elevating to reviewer/approver:
        add the requires-mfa realm role.
      On TenantRoleGranted: add the requires-mfa realm role.
      On TenantRoleRevoked: check whether the user still holds any other
        role/level that requires MFA; drop the realm role if not.

      This is the ONLY IAM-subsystem writer to Keycloak Admin API for MFA
      role toggling — org-membership never calls Keycloak Admin API directly.

      Idempotency key: (id, consumer="realm-provisioner") in processed_events.
