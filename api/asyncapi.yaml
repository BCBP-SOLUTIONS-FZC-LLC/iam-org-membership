    TenantReactivated:
      name: TenantReactivated
      title: Tenant Reactivated
      summary: |
        Consumed by this service, not published — and, as of the F1 fix
        (RP↔O&M alignment review), consumed on TWO queues from TWO
        producers: billing-orgm-q (Billing Service, the normal paid
        cancelled→reactivated path) and tenant-orgm-q (Realm Provisioner,
        RP-10 reversing an RP-14 operator-sourced suspension). Both land in
        the exact same applyProjection case, which reads no payload fields
        at all — it derives the outcome purely from the tenants row's own
        current state, so behavior is identical regardless of producer.
        Sets tenants.status='active', tenants.cancelled_at=NULL, and
        tenants.suspension_source=NULL (T-16, resolves RP-11; cleared
        unconditionally regardless of whether the prior suspension was
        'billing_lapse' or 'operator') — but only when the tenant is not
        already offboarded (PAID-1: offboarded is terminal; a reactivation
        attempt on an offboarded tenant is logged and rejected as a no-op,
        not an error). EVT-14 recency (tenants.last_event_at under the row
        lock) makes the two producers safe to interleave — the newest
        producer-stamped event always wins regardless of which queue it
        arrived on.
      x-lifecycle:
        status: active
      x-owner:
        team: team-billing
        slack: "#billing-events"
      tags:
        - $ref: '#/components/tags/consumed'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/TenantReactivatedEnvelope'
      bindings:
        sns:
          messageAttributes:
            EventType:
              dataType: String
              value: TenantReactivated
              description: Set by the producer (Billing Service on billing-orgm-q, or Realm Provisioner on tenant-orgm-q). Matches this service's SNS filter policy on the respective queue.
            TenantID:
              dataType: String
              description: Dynamic — the tenant being reactivated. Matches envelope.tenant_id.
            Source:
              dataType: String
              description: Publishing service identifier — "iam-billing" (billing-orgm-q) or "iam-realm-provisioner" (tenant-orgm-q, operator-reactivation path).
            EventID:
              dataType: String
              description: Dynamic — envelope id. Used as the processed_events dedup key (consumer="iam-org-membership").

    TenantSeatsChanged:
      name: TenantSeatsChanged
      title: Tenant Seats Changed
      summary: |
        Consumed by this service, not published. Sets tenants.licensed_seats
        unconditionally (SEAT-2 — always accepted, regardless of current
        seat usage). May itself open or close a seat-overage window on the
        next seat-usage reconciler pass if the new value crosses
        (active_users + pending_invitations).
      x-lifecycle:
        status: active
