      Status as of 2026-09-20 (Gap 12, gap_doc/pending_gap_sep15.md):
      this consumer is real, tested code (catalog_consumer_test.go), but
      the chain is inert end-to-end — iam-catalog-admin has not built the
      publisher side (verified against its own source: no port.EventNotifier,
      no notify() call sites, no Terraform for the SNS topic/SQS
      subscription; its own .claude/api-and-events.md lists this event as
      a "deferred option" it has not committed to, CAT-D3) and
      SQS_CATALOG_ORGM_QUEUE_URL is unset in every environment. The
      DepartmentCatalogChangedPayload schema below is consequently a
      minimal open placeholder, not a confirmed producer contract — this
      service's own handler does not depend on it having any particular
      shape, and it should be replaced once iam-catalog-admin actually
      defines and ships the real payload.
    messages:
      - $ref: '#/channels/catalogOrgmQueue/messages/DepartmentCatalogChanged'

components:
  securitySchemes:
    iamRole:
      type: httpApiKey
      name: Authorization
      in: header
      description: AWS IAM role attached to the pod via IRSA (IAM Roles for Service Accounts).

  tags:
    published:
      name: published
      description: |
        This service is the producer. Emitted onto iam-membership-events
        (12 event types) or iam-tenant-events (2 event types, co-produced
        alongside Realm Provisioner and Billing) via the transactional
        outbox (LLD §7.3/§7.4). Every message in components/messages except
        the 14 consumed ones below, the publishMembershipEvents /
        publishTenantEvents send operations, and the downstream fan-out
        receive operations (Audit/AuthZ/Realm Provisioner/Notification/
        Workflow/Billing — informational, documenting how other teams
        consume what this service publishes) all carry this tag.
    consumed:
      name: consumed
      description: |
        This service is the consumer, not the producer. Per §7.1, Org &
        Membership subscribes to three inbound queues: tenant-orgm-q
        (Realm Provisioner's iam.tenant.events — 8 tenant-lifecycle event
        types) and billing-orgm-q (Billing's billing.events — 5 billing
        event types), both handled by the single MembershipEventConsumer
        in internal/adapter/inbound/consumer/membership_event_consumer.go
        (EVT-14 recency guard, EVT-15 future-time clamp, EVT-16 tenant-
        state relay); and catalog-orgm-q (Catalog / Admin Config Service's
        DepartmentCatalogChanged — 1 event type, Gap 12), handled by a
        separate CatalogConsumer in
        internal/adapter/inbound/consumer/catalog_consumer.go with no
        EVT-14/15/16 guards — it only clears the om:departments cache on
        receipt, still inert pending iam-catalog-admin's producer side.
        Canonical schema ownership for anything tagged consumed sits with
        the producing service's own AsyncAPI spec, not this file — treat
        these definitions as this service's consumer-side documentation,
        kept in sync with upstream, not as the source of truth.

  messageTraits:
    glueWireFormat:
      description: |
        Message body is prefixed with the 18-byte Glue Schema Registry wire-format header:
        [0x03][0x00][16-byte schema version UUID (big-endian)] followed by the JSON payload.
        Consumers must strip this header before parsing the EventEnvelope JSON.

  messages:
    DepartmentMembershipGranted:
      name: DepartmentMembershipGranted
      title: Department Membership Granted
      summary: Emitted when a user is added to a department at a specific role-level (preparator / reviewer / approver).
      x-lifecycle:
        status: active    # active | deprecated | retired
      x-owner:
        team: team-iam
        slack: "#iam-events"
      tags:
        - $ref: '#/components/tags/published'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/DepartmentMembershipGrantedEnvelope'
      bindings:
        sns:
          messageAttributes:
            EventType:
              dataType: String
              value: DepartmentMembershipGranted
              description: PascalCase event type. Set by platform-events v1.3.0 from envelope.type. Attribute name is PascalCase per LLD §7.3.
            TenantID:
              dataType: String
              description: Dynamic — set from envelope.tenant_id at publish time. Enables per-tenant SNS filter policies without parsing the message body.
            Source:
              dataType: String
              value: iam-org-membership
              description: Publishing service identifier. Set by platform-events v1.3.0 from envelope.source (with the topic-routing suffix stripped).
            EventID:
              dataType: String
              description: Dynamic — RFC 4122 UUID v7 echoed from envelope.id. Enables filter policies scoped to a specific event without parsing the body.
            Subject:
              dataType: String
              description: Dynamic — set from envelope.subject at publish time. Enables per-subject SNS filter policies (v1.3.0 addition).

    DepartmentMembershipRevoked:
      name: DepartmentMembershipRevoked
      title: Department Membership Revoked
      summary: Emitted when a user is removed from a department (soft-delete; the row is retained with deleted_at set).
