              value: TrialTenantProvisioned
              description: Set by the producer (Realm Provisioner). Matches this service's SNS filter policy on tenant-orgm-q.
            TenantID:
              dataType: String
              description: Dynamic — the tenant being provisioned. Matches envelope.tenant_id.
            Source:
              dataType: String
              description: Publishing service identifier — expected "iam-realm-provisioner".
            EventID:
              dataType: String
              description: Dynamic — envelope id. Used as the processed_events dedup key (consumer="iam-org-membership").

