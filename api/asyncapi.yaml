    # ── Consumed messages (§7.1) ─────────────────────────────────────────────
    # Producers are the Realm Provisioner (tenant-orgm-q, first 8) and the
    # Billing Service (billing-orgm-q, last 5), not this service. Documented
    # here as this service's consumer-side contract — see the "consumed" tag
    # description and the tenantOrgmQueue/billingOrgmQueue channel notes for
    # the ownership caveat.
    TrialTenantProvisioned:
      name: TrialTenantProvisioned
      title: Trial Tenant Provisioned
      summary: |
        Consumed by this service, not published. Classified as a known
        tenant-lifecycle type so it is dedup-recorded rather than falling
        into the kindUnknown silent-ack path, but applyProjection treats it
        as a no-op — it does NOT mutate tenants.status/plan here. The actual
        trial-tenant provisioning transaction (5 default departments + 3
        dept-role labels + owner role grant + TenantCreated/TrialStarted,
        §8.1) runs synchronously via I-1 POST /api/v1/internal/tenants,
        called directly over HTTP by Realm Provisioner's own
        TrialTenantProvisioned handler once the Keycloak realm is ready —
        not via this SQS event.
      x-lifecycle:
        status: active
      x-owner:
        team: team-tenant-lifecycle
        slack: "#tenant-lifecycle"
      tags:
        - $ref: '#/components/tags/consumed'
