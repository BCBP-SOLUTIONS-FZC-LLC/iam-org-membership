    action: receive
    channel:
      $ref: '#/channels/membershipWorkflowQueue'
    tags:
      - $ref: '#/components/tags/published'
    summary: Workflow reacts to assignee overrides and tenant-state relay
    description: |
      Consumer: Workflow Service
      Queue   : membership-workflow-q  |  DLQ: membership-workflow-q-dlq
      Filter  : EventType IN [TenderAssigneeOverridden,
                              DepartmentMembership*, TenantStateChanged]

      Delegation routing is no longer driven from this queue — Workflow's
        §8.8 delegate-impact gate (GetDelegateImpact / ReassignDelegate /
        CancelByDelegate) is a synchronous call from org-membership, not an
        event subscription, and any delegation-lifecycle event Workflow
        needs now comes from the Delegation Service's own
        iam.delegation.events topic.
      On TenderAssigneeOverridden: reconcile Workflow's own assignee_overrides
        state — Workflow is the sole writer of that state, org-membership only
        validates + emits (§16 A32(d) / OVR-1).
      On DepartmentMembership*: fold role-level changes into any assignee
        selection surfaces (Workflow does not own the department model but
        uses it for pick-lists).
      On TenantStateChanged (EVT-16 relay of TenantSuspended / Cancelled /
        Offboarded from Billing, and of TrialExpired etc.): pause / resume /
        terminate workflow instances or route them onto per-tier queues.
        The relay lets Workflow subscribe to a single topic instead of also
        subscribing directly to iam-tenant-events and billing.events.

