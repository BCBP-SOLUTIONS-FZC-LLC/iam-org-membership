asyncapi: 3.0.0

info:
  title: IAM Org & Membership Events
  version: "1.0.0"
  description: |
    Domain events published by iam-org-membership. Unlike the sibling
    iam-user-profile service (single topic, single Glue registry), this
    service publishes to TWO SNS topics backed by TWO Glue Schema
    Registries — one per topic, per SCHEMA-7 (LLD §7.3.1):

      Topic                        Glue registry            Events
      ─────────────────────────────────────────────────────────────
      iam-membership-events        iam-membership-events    11 (see below)
      iam-tenant-events            iam-tenant-events        2  (TenantCreated, TrialStarted)

    The two-topic split follows HLD §9.1: tenant lifecycle (creation,
    trial start) fans out to a different consumer set than membership
    lifecycle (department grants, role grants, membership-revocation
    cascades, seat overage, tenant-state relay). Selecting the destination
    topic by
    Envelope.Source is the job of platform-events RoutingPublisher —
    see internal/adapter/outbound/eventbus/publisher.go.

    Wire format: each SNS message body is prefixed with an 18-byte AWS Glue
    Schema Registry header before the EventEnvelope JSON:
      byte 0     : header version (0x03)
      byte 1     : compression    (0x00 = none)
      bytes 2-17 : schema version UUID (big-endian)

    Glue registries : iam-membership-events, iam-tenant-events (ap-south-1, JSON data format)
    Schemas         : one per event type, named by PascalCase event type string
                      (e.g. DepartmentMembershipGranted). This convention matches
                      the on-disk files under
                      internal/adapter/outbound/eventbus/schemas/*.json — the
                      filename stem IS the Glue schema name and the value of the
                      envelope.type field.

    Schema versioning: the authoritative schema version identifier is the 16-byte
    UUID in the Glue wire-format header (bytes 2–17). The same UUID is echoed into
    the envelope JSON as dataschema so consumers that work with the decoded body
    can inspect or log it without re-parsing the binary header. The UUID is resolved
    from the appropriate Glue registry at startup and cached; it changes automatically
    whenever a new schema version is registered in Glue. In dev/test (NoopCodec) there
    is no Glue header and dataschema is absent from the envelope.

    Failure mode: the ValidatingCodec loads every schema in
    internal/adapter/outbound/eventbus/schemas/ at startup (embedded via
    //go:embed schemas/*.json) and resolves the corresponding Glue schema version
    UUIDs from BOTH registries in a single startup pass. If any lookup fails,
    cmd/server/main.go panics — the pod crashes and Kubernetes restarts it
    (CrashLoopBackoff). This is intentional: a pod that cannot reach a Glue
    registry would silently produce malformed events rather than failing visibly.

    Resolution path:
      1. Verify GLUE_REGISTRY_MEMBERSHIP_NAME and GLUE_REGISTRY_TENANT_NAME are
         both correct and both registries + their schemas exist.
      2. Verify the pod IAM role has glue:GetSchemaVersion on BOTH registry ARNs.
      3. Fix the root cause — the pod will recover automatically on the next restart.
    Alert on outbox_dead_letters_total (per source topic) for events that fail
    after a successful startup.

    ── Message Size Limit ───────────────────────────────────────────────────────
    SNS hard limit: 256 KB per message (total wire size including the 18-byte Glue
    header and all SNS framing).

    This service enforces a 240 KB soft limit at outbox-enqueue time (inside
    insertEnvelope in eventbus/publisher.go). The 16 KB headroom covers:
      • 18-byte Glue wire-format header
      • SNS base64 encoding overhead (~33 % for binary attributes)
      • SNS JSON framing for the PublishInput body

    If the envelope exceeds 240 KB, Enqueue returns an error and the business
    transaction is rolled back — the event is never written to the outbox.
    Consumers do not need to handle oversized messages; they cannot arrive.

    Payload budget guidance (per event type): all 13 payloads emitted by this
    service are small — UUIDs, short enums, timestamps, and (for
    TenantStateChanged) a bounded event-type string. None approach the
    240 KB soft limit under any realistic load.

    ── Schema Evolution Rules (CLOSED schemas) ──────────────────────────────────
    All 13 on-disk JSON Schemas at internal/adapter/outbound/eventbus/schemas/*.json
    declare "additionalProperties": false. This is a deliberate contract choice
    (see §16 open-question register): consumers MAY safely reject unknown fields
    at the JSON-schema-validation layer, and every payload change is observable.

    This means the reference "add optional field = silent Glue version bump"
    workflow used by iam-user-profile DOES NOT APPLY here. Under closed schemas:

      • Adding ANY payload field (even an optional one) is a Glue schema version
        bump AND requires a coordinated producer → consumer rollout: consumers
        that strictly validate against the previous schema version will reject
        the new envelope until they are redeployed with the updated schema.
      • Removing a field is a breaking change.
      • Renaming a field is a breaking change.
      • Widening an enum is a Glue schema version bump; consumers that switch
        exhaustively on the enum MUST include a default/else branch before the
        widened version is deployed on the producer.
      • Narrowing an enum, changing a field's type/format, or making an optional
        field required are breaking changes.

    Breaking changes (MUST bump wire type to <EventName>.v2):
      • Removing or renaming a field.
      • Changing a field's type or format.
      • Narrowing an enum (removing a value).
      • Making an optional field required.

    When introducing a v2: publish BOTH the old and new type for one release
    cycle to give all consumers time to migrate, then retire the old type.

    ── Consumer Conformance ─────────────────────────────────────────────────────
    See ARCHITECTURE.md § "Consumer conformance checklist" for the full checklist
    that downstream services must satisfy before subscribing to these channels.
    See x-forward-compatibility below for the closed-schema rollout protocol.

  x-forward-compatibility:
    summary: >-
      This service publishes CLOSED-schema payloads (additionalProperties: false
      on every on-disk JSON Schema). Consequently there is NO free forward-
      compatibility — every payload addition requires a coordinated rollout of
      the producer AND all validating consumers, in that order.
    schema-shape: CLOSED
    rollout-sequence:
      - "1. Register new schema in the appropriate Glue registry (membership or tenant); the UUID rotates and envelope.dataschema changes accordingly."
      - "2. Deploy all consumers with the updated schema embedded (or with lenient deserialization enabled — see defense-in-depth below)."
      - "3. Deploy the producer (starts emitting the new field / wider enum). ONLY step 3 causes wire behaviour to change; earlier steps merely prepare consumers."
    defense-in-depth-settings:
      summary: >-
        Even with closed schemas at the wire-contract level, consumers are
        RECOMMENDED (not required) to enable lenient JSON deserialization at the
        SDK/language layer. This protects against Glue version drift during
        a rolling deploy — a consumer replica that has not yet picked up the
        new schema definition still decodes the message body cleanly rather
        than crashing on an unknown-field error. JSON-schema validation
        against the pinned schema version is where the closed-schema contract
        is enforced; SDK-level strict mode adds no safety and only creates
        deploy-order fragility.
      go-encoding-json: "Do NOT call json.Decoder.DisallowUnknownFields(). Unknown fields are silently ignored by default."
      go-sonic: "Do NOT use sonic.ConfigStrict. Use sonic.ConfigDefault or sonic.ConfigFastest."
      java-jackson: "mapper.configure(DeserializationFeature.FAIL_ON_UNKNOWN_PROPERTIES, false) OR @JsonIgnoreProperties(ignoreUnknown=true) on every payload class."
      python-pydantic-v2: "model_config = ConfigDict(extra='ignore') on every payload model."
      kotlin-serialization: "Json { ignoreUnknownKeys = true } on the Json instance used to decode payloads."
    enum-safety: >-
      All switch/match/when on enum values MUST include a default/else branch.
      Enum widening bumps the Glue schema version but does NOT force a wire type
      bump — a rolling deploy will briefly have consumer replicas seeing values
      they do not recognise. An unhandled enum value crashes exhaustive matchers.
    closed-schema-contract: >-
      All payload schemas in internal/adapter/outbound/eventbus/schemas/ declare
      "additionalProperties": false. This is a deliberate contract signal: the
      shape is CLOSED and every field addition is observable at the JSON-schema
      layer. CI schema-registry.yml enforces registration and lifecycle diff
      against this convention. Do NOT flip any payload to additionalProperties:
      true without an org-wide decision and a matching update to schema-gov
      configuration — the closed-schema decision is documented in the LLD §16
      open-question register.
    ci-integration: >-
      .github/workflows/schema-registry.yml runs the platform-schemagov container
      (ghcr.io/bcbp-solutions-fzc-llc/platform-schemagov:0.4) on every PR:
      extract → validate → enforce-lifecycle → diff. On main it additionally runs
      register / changelog / metrics against BOTH Glue registries. The diff step
      distinguishes breaking from non-breaking changes and blocks the former;
      the enforce-lifecycle step blocks any active-status schema removal.

  x-semantic-contract:
    summary: >-
      JSON Schema structural diff cannot detect semantic drift: a field's units,
      scale, or business meaning can change without any structural difference.
      Example: "licensed_seats": 100 was licensed users, now is licensed
      workspaces — type stays integer, constraints unchanged, but every
      consumer's interpretation is wrong.
    detection: >-
      If field descriptions or titles change between Glue schema versions, the
      platform-schemagov diff step emits a semantic-drift warning in the
      changelog. This is the only automated signal available — semantic intent
      lives in human-readable documentation, not in the JSON Schema type system.
    required-action: >-
      When a semantic-drift annotation appears in CI output, the PR author MUST
      confirm in the "Event Schema Semantic Evolution" checklist that the
      change is wording-only. If the field's observable meaning changed (units,
      scale, encoding, nullability), create a versioned type (e.g.
      TenantSeatOverageStarted.v2) and mark the old type deprecated. Do not
      reuse an existing field name for a semantically different value.
    field-annotation-guidance: >-
      Annotate fields with semantic intent in their description or a companion
      x-unit extension so drift is detectable during review. Examples:
        licensed_seats:
          type: integer
          description: "Number of paid user seats sold on the plan.
                        Not workspaces, not tenants, not devices. Excludes
                        pending invitations (those are counted separately)."
        overage_since:
          type: string
          format: date-time
          description: "UTC timestamp of the first observation that (active_users
                        + pending_invitations) > licensed_seats. Not the moment
                        an invitation was staged, not the moment a user was added."

  x-consumer-sdk:
    summary: >-
      Consumer SDKs are RECOMMENDED to be configured for lenient JSON decoding
      at the SDK layer even though this service publishes closed-schema payloads.
      Lenient SDK decoding protects consumers against a rolling deploy window
      where the schema in Glue has advanced past the schema pinned in the
      consumer binary. Strict validation of the closed contract is the job of
      JSON-schema validation against the pinned schema version, not SDK strict
      mode.
    in-repo-enforcement: >-
      This service embeds all 14 schemas at compile time via //go:embed
      schemas/*.json in internal/adapter/outbound/eventbus/codec.go. The
      ValidatingCodec validates outgoing payloads against those pinned schemas
      before publish; drift between the pinned schema and Glue is caught by CI
      (schema-registry.yml diff step), not at runtime.
    out-of-repo-guidance: >-
      External consumer services should embed the schema files from this
      repository (or from schema-gov's exported artefact) rather than fetching
      them from Glue at runtime. Cold-start Glue lookups couple every consumer
      pod restart to the Glue control plane, which is neither the design nor
      the failure profile you want on the hot path. The recommended approach
      for platform-managed services is to depend on the shared platform-events
      SQS consumer and layer JSON-schema validation on top with the schemas
      embedded from a versioned artefact.

  x-version-governance:
    summary: >-
      Glue schema version numbers (per registry) are not API versions — they are
      internal counters that increment on every registered schema change. High
      version numbers (beyond SCHEMA_VERSIONS_ALERT_THRESHOLD, default 10) signal
      that a schema has been evolving in-place rather than being compacted into
      a clean .v2 event type. Because this service uses two Glue registries, the
      threshold applies per (registry, schema) pair.
    compaction-protocol: |
      When a schema exceeds the version threshold, introduce a clean-slate replacement:
        1. Create  internal/adapter/outbound/eventbus/schemas/{name}.v2.json  (new field layout from scratch)
        2. Register {name}.v2 as a new AsyncAPI message in this file with x-lifecycle:
           {status: active}
        3. Mark the old message: x-lifecycle: {status: deprecated, deprecated-by: {name}.v2,
           retire-after: YYYY-MM-DD}
        4. Dual-publish from the producer for one release cycle (RoutingPublisher
           preserves per-message topic routing — the .v2 stays on the same topic).
        5. Migrate all consumers to the .v2 type (notify owners via x-owner.slack)
        6. Retire the old type — schema-gov emits the exact cleanup commands
           against the correct registry.
    why-not-always-v2: >-
      Under closed schemas ANY field addition already forces a Glue version bump
      AND a coordinated consumer rollout, but that does NOT necessarily require
      a .v2 wire type — the wire type name only changes for genuinely breaking
      changes (field removal/rename, type change, required-widening). A .v2 is
      also warranted when cumulative evolution has made the schema complex
      enough that a clean redesign improves clarity.
    two-registry-matrix: >-
      Cleanup workflow (schema-registry.yml → platform-schemagov) targets BOTH
      registries in a single CI run. Per SCHEMA-7 no schema lives in both
      registries — the registry a schema belongs to is determined by which
      topic its events flow through, which is determined by envelope.source
      inside RoutingPublisher. When adding a new event, decide the target
      topic first; the target registry then follows automatically.
    cleanup-cadence: |
      Cleanup actions are manual and deliberate — never automated without operator approval.

      Monthly  (schema-prune.yml, schedule):
        • Dry-run listing of orphaned schemas per registry (in Glue, no repo file).
        • Operator reviews output → re-triggers with dry_run=false when ready.

      Quarterly  (schema-health-quarterly.yml, schedule):
        • Runs schema-gov lifecycle check across BOTH registries — surfaces
          overdue deprecations, stale x-usage-override entries, missing
          lifecycle annotations.
        • Reports any schema whose Glue version exceeds
          SCHEMA_VERSIONS_ALERT_THRESHOLD (default 10) as a compaction candidate.
        • No mutations — purely a review prompt for the owning team.

      Ad-hoc  (schema-prune.yml, workflow_dispatch):
        • Operator-triggered execute mode deletes retired schemas and archives
          all version definitions to docs/schema-archive/. Production pruning
          is always manual; the schedule only targets staging.

      Version accumulation trigger:
        • SCHEMA_VERSIONS_ALERT_THRESHOLD exceeded  → SchemaVersionAccumulation CW alarm
        • Three consecutive quarterly reviews with a schema above threshold → initiate
          compaction-protocol above for that schema before the next review

  x-usage-override:
    summary: >-
      Escape hatch for CloudWatch usage false negatives. When usage lifecycle
      checks report NEVER_SEEN but the team knows the event IS active
      (CW metric delay, namespace migration, missing dimension), add this
      annotation to suppress NEVER_SEEN enforcement for a bounded window.
    format: |
      # In a components/messages entry:
      x-usage-override:
        status: active-override   # the only accepted value
        reason: "CloudWatch namespace migration in progress — metrics will appear once
                 the USAGE_METRIC_NAMESPACE env var is updated in the staging environment"
        until:  YYYY-MM-DD        # remove the annotation on or after this date
    lifecycle: >-
      Lifecycle checks warn when x-usage-override.until is in the past so stale
      overrides are noticed and cleaned up. The override MUST be removed once
      CloudWatch data normalises — leaving it in place would permanently
      suppress lifecycle enforcement for that event type.
    when-to-use:
      - CloudWatch namespace or dimension name changed and the old lookback window covers the gap
      - Metrics are delayed due to a CloudWatch service event (check AWS Service Health)
      - A new event type was just registered and has not yet accumulated lookback-window data
    when-not-to-use:
      - As a permanent workaround for missing metrics — fix the metric emission instead
      - To defer a legitimate deprecation decision — the event should be marked deprecated

  license:
    name: Proprietary

defaultContentType: application/json

tags:
  - $ref: '#/components/tags/published'
  - $ref: '#/components/tags/consumed'

servers:
  production:
    host: "sns.ap-south-1.amazonaws.com"
    protocol: sns
    description: |
      AWS SNS in ap-south-1. TWO topic ARNs are configured via env:
        • SNS_TOPIC_MEMBERSHIP_ARN — iam-membership-events (12 event types)
        • SNS_TOPIC_TENANT_ARN     — iam-tenant-events     (2  event types)
      RoutingPublisher (platform-events v1.3.0) selects the destination
      topic per message by inspecting Envelope.Source:
        Source == "iam-org-membership.membership" → membership topic
        Source == "iam-org-membership.tenant"     → tenant topic
      Pod IAM role requires, on BOTH Glue registry ARNs
      (GLUE_REGISTRY_MEMBERSHIP_ARN, GLUE_REGISTRY_TENANT_ARN):
        glue:GetRegistry, glue:GetSchema, glue:GetSchemaVersion, glue:QuerySchemaVersionMetadata
      Schema registration (glue:CreateSchema, glue:RegisterSchemaVersion) is CD-only.
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  # ── Fan-out: SQS consumer queues (LLD §7.3.2) ─────────────────────────────
  # Each queue is created and owned by its consuming service (HLD §9.1).
  # This service publishes to the SNS topics only; it does not manage these queues.
  # Queue naming convention: <topic-short>-<consumer-short>-q  (HLD §9.1)

  # ── Consumers of iam-membership-events ─────────────────────────────────────
  sqsMembershipAudit:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      SQS queue for the Audit Log consumer.
      Queue: membership-audit-q  |  DLQ: membership-audit-q-dlq  (maxReceiveCount=5)
      Owned and managed by: Audit Log Service
      SNS subscription filter: no filter (subscribes to all 11 membership event types)
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  sqsMembershipAuthZ:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      SQS queue for the AuthZ Enrichment consumer.
      Queue: membership-authz-q  |  DLQ: membership-authz-q-dlq  (maxReceiveCount=5)
      Owned and managed by: AuthZ Enrichment Service
      SNS subscription filter: EventType IN [DepartmentMembershipGranted,
        DepartmentMembershipRevoked, DepartmentMembershipLevelChanged,
        TenantRoleGranted, TenantRoleRevoked, MembershipRevoked]
        (AuthZ evicts / refreshes the om:memberships cache — hot-path lookup I-8)
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  sqsMembershipRealm:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      SQS queue for the Realm Provisioner consumer.
      Queue: membership-realm-q  |  DLQ: membership-realm-q-dlq  (maxReceiveCount=5)
      Owned and managed by: Realm Provisioner Service
      SNS subscription filter: EventType IN [DepartmentMembershipGranted,
        DepartmentMembershipLevelChanged, TenantRoleGranted, TenantRoleRevoked]
        (Realm Provisioner adds/drops the requires-mfa realm role on the user
         per §6.5 — the only IAM-subsystem write path to Keycloak Admin API)
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  sqsMembershipNotification:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      SQS queue for the Notification consumer.
      Queue: membership-notification-q  |  DLQ: membership-notification-q-dlq  (maxReceiveCount=5)
      Owned and managed by: Notification Service
      SNS subscription filter: EventType IN [DepartmentMembershipGranted,
        DepartmentMembershipRevoked, DepartmentMembershipLevelChanged,
        TenantRoleGranted, TenantRoleRevoked, TenantSeatOverageStarted,
        TenantSeatOverageResolved]
        (Notification drives user/admin emails + seat-overage banners)
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  sqsMembershipWorkflow:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      SQS queue for the Workflow Service consumer.
      Queue: membership-workflow-q  |  DLQ: membership-workflow-q-dlq  (maxReceiveCount=5)
      Owned and managed by: Workflow Service
      SNS subscription filter: EventType IN [TenderAssigneeOverridden,
        DepartmentMembershipGranted, DepartmentMembershipRevoked,
        DepartmentMembershipLevelChanged, TenantStateChanged]
        (Workflow drives assignee reconciliation and tenant-state
         pause/resume/terminate/queue-routing via the §7.1 EVT-16 relay of
         tenant-lifecycle events onto iam-membership-events; delegation
         routing itself is now the Delegation Service's concern, sourced
         from its own iam.delegation.events topic, not this one)
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  sqsMembershipBilling:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      SQS queue for the Billing consumer.
      Queue: membership-billing-q  |  DLQ: membership-billing-q-dlq  (maxReceiveCount=5)
      Owned and managed by: Billing Service
      SNS subscription filter: EventType IN [TenantSeatOverageStarted, TenantSeatOverageResolved]
        (Billing drives grace period / enforcement window — §16 A59, SEAT-3/SEAT-5)
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  # ── Consumers of iam-tenant-events ─────────────────────────────────────────
  sqsTenantAudit:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      SQS queue for the Audit Log consumer on the tenant lifecycle topic.
      Queue: tenant-audit-q  |  DLQ: tenant-audit-q-dlq  (maxReceiveCount=5)
      Owned and managed by: Audit Log Service
      SNS subscription filter: no filter (subscribes to TenantCreated + TrialStarted
        from this service and to all other tenant lifecycle events emitted onto
        iam-tenant-events by other producers — Realm Provisioner, Billing)
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  sqsTenantNotification:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      SQS queue for the Notification consumer on the tenant lifecycle topic.
      Queue: tenant-notification-q  |  DLQ: tenant-notification-q-dlq  (maxReceiveCount=5)
      Owned and managed by: Notification Service
      SNS subscription filter: EventType IN [TenantCreated, TrialStarted]
        (Notification sends the welcome email + trial-start email)
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  sqsTenantRealm:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      SQS queue for the Realm Provisioner consumer on the tenant lifecycle topic.
      Queue: tenant-realm-q  |  DLQ: tenant-realm-q-dlq  (maxReceiveCount=5)
      Owned and managed by: Realm Provisioner Service
      SNS subscription filter: EventType IN [TrialStarted]
        (Realm Provisioner records trial_ends_at locally on its own tenant_realms
         row and runs its own realm-side expiry sweep off that value — it does not
         poll this service; see this service's LLD §7.3/§8.7 for the resolved
         RP-4 open question)
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  # ── Inbound: the three queues this service consumes (§7.1) ────────────────
  # Owned by this service (iam-org-membership), NOT by the producer. Each is
  # subscribed to a topic owned and published by another service.
  sqsTenantOrgm:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      SQS queue owned and managed by this service, subscribed to the
      iam.tenant.events SNS topic (owned by the Realm Provisioner).
      Queue: tenant-orgm-q  |  DLQ: tenant-orgm-q-dlq  (maxReceiveCount=5)
      SNS subscription filter: EventType IN [TrialTenantProvisioned,
        TenantRealmReady, TenantConverted, DirectPaidSignup, TrialExpired,
        TrialReactivated, TenantSuspended, TenantOffboarded, TenantReactivated]
        (this service never subscribes to its own co-produced TenantCreated/
        TrialStarted on the same topic — HLD §9.1.1 "no self-consumption",
        produce/consume sets on iam.tenant.events are disjoint)
        (new — resolves F1 of the RP↔O&M alignment review: RP emits
        TenantReactivated{source=operator} here to reverse an operator-
        sourced suspension, RP-10 undoing RP-14; the shared TenantReactivated
        handler is queue-agnostic and already derives active/trial from
        subscription_started_at and clears suspension_source regardless of
        which topic/producer delivered it, T-16)
      Consumer short-name: orgm. Configured via SQS_TENANT_ORGM_QUEUE_URL.
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  sqsBillingOrgm:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      SQS queue owned and managed by this service, subscribed to the
      billing.events SNS topic (owned by the Billing Service).
      Queue: billing-orgm-q  |  DLQ: billing-orgm-q-dlq  (maxReceiveCount=5)
      SNS subscription filter: EventType IN [TenantPlanChanged,
        TenantPaymentPastDue, TenantSubscriptionCancelled, TenantReactivated,
        TenantSeatsChanged]
      Consumer short-name: orgm. Configured via SQS_BILLING_ORGM_QUEUE_URL.
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  sqsCatalogOrgm:
    host: "sqs.ap-south-1.amazonaws.com"
    protocol: sqs
    description: |
      SQS queue owned and managed by this service, intended to subscribe to
      a future SNS topic owned by the Catalog / Admin Config Service
      (iam-catalog-admin). Queue: catalog-orgm-q  |  DLQ: catalog-orgm-q-dlq
      (maxReceiveCount=5). Consumer short-name: orgm. Configured via
      SQS_CATALOG_ORGM_QUEUE_URL.

      Added 2026-09-20 to document what already exists in code (Gap 12,
      gap_doc/pending_gap_sep15.md): this service's consumer
      (internal/adapter/inbound/consumer/catalog_consumer.go) is real,
      tested code — but the producer side does not exist yet. Verified
      directly against iam-catalog-admin's own source and docs: its
      .claude/api-and-events.md lists DepartmentCatalogChanged as a
      "deferred option" (CAT-D3) it has not committed to building, not a
      contract this service can treat as settled. SQS_CATALOG_ORGM_QUEUE_URL
      is unset in every environment today, so this queue does not exist yet
      either — this server entry documents the intended shape, not a live
      resource.
    security:
      - $ref: '#/components/securitySchemes/iamRole'

channels:
  # ── Producer channels (topics owned by this service) ──────────────────────
  iamMembershipEvents:
    address: "iam-membership-events"
    description: |
      SNS topic for all membership-lifecycle events (12 event types).
      Consumers subscribe with an SNS filter policy on the EventType MessageAttribute
      to receive only the event types they care about. Full set of attributes emitted
      per message: EventType, TenantID, Source, EventID, and Subject (all PascalCase,
      set by platform-events v1.3.0 — see LLD §7.3).

      Backing Glue registry: iam-membership-events (ap-south-1, JSON data format).

      Ordering: standard SNS does not guarantee delivery order. Messages for the
      same tenant / user may arrive out of sequence (e.g. DepartmentMembershipLevelChanged
      before DepartmentMembershipGranted). Consumers must handle this explicitly:
        • Use subject + id (RFC 4122 UUID v7, monotonically ordered by creation time)
          to detect and discard stale events: if a stored id > incoming id for
          the same subject, the incoming message is older and should be ignored.
        • Use the time field as a secondary tiebreaker when comparing events of different types.
        • Provision-on-demand: if DepartmentMembershipLevelChanged arrives for an
          unknown (user, department) pair, backfill via the HTTP API rather than
          dropping the event.

      Throughput and burst behaviour:
        SNS standard topics deliver messages concurrently without ordering guarantees
        and without a per-subscription rate cap (subject to per-account SNS TPS limits).
        During high-traffic bursts (e.g. bulk invitation acceptance, mass department
        reorganisation) a consumer SQS queue may receive many messages simultaneously
        for the same tenant_id.

        Consumer scaling requirements:
          • Scale horizontally: multiple consumer replicas can poll the same SQS queue
            safely (SQS visibility timeout prevents double-processing). Scale replicas
            based on queue depth (ApproximateNumberOfMessages) rather than a fixed count.
          • Avoid per-tenant locking bottlenecks: do not hold a long-lived row-level lock
            on a tenant record while processing. Use optimistic concurrency (record_version
            column) or short-lived locks scoped to the critical section only.
          • Partition-aware processing (advanced): if strict per-tenant serialisation is
            required without FIFO topics, shard workers by hash(tenant_id) % N so all
            events for a given tenant are routed to the same worker.

      FIFO alternative: migrate to an SNS FIFO topic with MessageGroupId = tenant_id
      to get strict per-tenant ordering with exactly-once delivery (10 msg/s per group
      limit applies). This is not the current deployment.

      Replayability: SNS standard topics do not retain messages. Events cannot be
      replayed from the broker after delivery — a consumer that misses an event cannot
      retrieve it by re-subscribing or seeking to an offset.

      Four replay mechanisms are available, in order of preference:

      1. SQS DLQ redrive (broker-level, recent failures only):
           Messages that failed processing and landed in a DLQ can be moved back to
           the source queue via SQS StartMessageMoveTask API (or console redrive).
           Covers delivery/processing failures within the SQS retention window
           (default 4 days). Does not replay successfully delivered events.

      2. Outbox-based replay (within outbox retention window):
           The platform-events outbox table retains event records for a configurable
           period (default: 7 days after successful SNS delivery, mirroring the
           processed_events 8-day retention window per PE-1). Within that window
           the O&M team can re-enqueue targeted events by id, subject, or
           event_type + time range. Contact the O&M team with the scope needed.
           This does NOT result in duplicate ids — new outbox rows with new ids
           are created so consumer idempotency keys are not bypassed.

      3. State-based backfill (recommended for new consumers or full recovery):
           Bootstrap from the REST API instead of replaying events:
             GET /api/v1/internal/users/:id/memberships   — hot-path snapshot (I-8)
             GET /api/v1/operator/tenants                 — operator tenant listing
             GET /api/v1/tenants/:id/departments          — per-tenant departments
           Apply the current state directly to your read model, then subscribe to
           future events. Synthetic events are NOT published during a backfill.

      4. No event store / time-travel:
           This service uses the transactional outbox as a delivery mechanism, not
           an event store. Arbitrary historical replay and point-in-time queries are
           not supported. Consumers that require a durable event history should
           archive received events in their own store (e.g. S3 + Athena, DynamoDB).

      ── Fan-out queue registry (LLD §7.3.2) ─────────────────────────────────
      Consumer          Queue                         DLQ                               Filter (EventType)
      ──────────────────────────────────────────────────────────────────────────────
      Audit Log         membership-audit-q            membership-audit-q-dlq            (all 12)
      AuthZ Enrichment  membership-authz-q            membership-authz-q-dlq            DepartmentMembership*, TenantRole*, MembershipRevoked
      Realm Provisioner membership-realm-q            membership-realm-q-dlq            DepartmentMembership{Granted,LevelChanged}, TenantRole*
      Notification      membership-notification-q     membership-notification-q-dlq     DepartmentMembership*, TenantRole*, TenantSeatOverage*
      Workflow          membership-workflow-q         membership-workflow-q-dlq         TenderAssigneeOverridden, DepartmentMembership*, TenantStateChanged
      Billing           membership-billing-q          membership-billing-q-dlq          TenantSeatOverage{Started,Resolved}

      All queues: maxReceiveCount=5, standard (non-FIFO).

      Sibling-service consumers (queues owned entirely by those services,
      not detailed as channels here since this repo has no config/binding
      visibility into them — see each owning service's own AsyncAPI spec):
        Delegation Service     delegation-cascade-q        MembershipRevoked, TenantMembershipsPurged
        Tender-ACL Service     (queue name owned by them)  MembershipRevoked, TenantMembershipsPurged
        Group-Mapping Service  (queue name owned by them)  TenantMembershipsPurged

      Queue security: every SQS queue that subscribes to this topic MUST enforce
      a resource-based policy restricting delivery to this SNS topic ARN. Without
      this, a misconfigured queue policy allows any AWS principal to inject forged
      messages directly into the queue, bypassing SNS entirely.

      Required SQS queue policy condition:
        "Condition": {
          "ArnEquals": { "aws:SourceArn": "<SNS_TOPIC_MEMBERSHIP_ARN>" }
        }

      Idempotency guards (id deduplication) do NOT protect against forgery —
      an attacker can generate arbitrary UUID v7 values. The queue policy is the
      only enforcement point for message authenticity in the SQS subscription model.

      Schema note: the Glue schema version UUID in the wire-format header (bytes 2–17)
      is authoritative for schema resolution; dataschema in the envelope JSON is
      informational only. Schemas resolve against the iam-membership-events registry.
    messages:
      DepartmentMembershipGranted:
        $ref: '#/components/messages/DepartmentMembershipGranted'
      DepartmentMembershipRevoked:
        $ref: '#/components/messages/DepartmentMembershipRevoked'
      DepartmentMembershipLevelChanged:
        $ref: '#/components/messages/DepartmentMembershipLevelChanged'
      TenantRoleGranted:
        $ref: '#/components/messages/TenantRoleGranted'
      TenantRoleRevoked:
        $ref: '#/components/messages/TenantRoleRevoked'
      MembershipRevoked:
        $ref: '#/components/messages/MembershipRevoked'
      TenderAssigneeOverridden:
        $ref: '#/components/messages/TenderAssigneeOverridden'
      TenantSeatOverageStarted:
        $ref: '#/components/messages/TenantSeatOverageStarted'
      TenantSeatOverageResolved:
        $ref: '#/components/messages/TenantSeatOverageResolved'
      TenantStateChanged:
        $ref: '#/components/messages/TenantStateChanged'
      TenantMembershipsPurged:
        $ref: '#/components/messages/TenantMembershipsPurged'
      MFAReset:
        $ref: '#/components/messages/MFAReset'

  iamTenantEvents:
    address: "iam-tenant-events"
    description: |
      SNS topic for tenant lifecycle creation events (2 event types from this
      service: TenantCreated, TrialStarted). This service is a co-producer on
      this topic alongside Realm Provisioner and Billing (per HLD §9.1.1
      shared-producer arrangement); other services emit other event types onto
      the same topic (e.g. TenantSuspended from Billing) — those are documented
      in their own AsyncAPI specs.

      Backing Glue registry: iam-tenant-events (ap-south-1, JSON data format).

      Ordering: TenantCreated is emitted exactly once per tenant, and TrialStarted
      follows within the same TrialTenantProvisioned business transaction — the
      two events for a single tenant are effectively adjacent on the outbox but
      SNS may deliver them out of order. Consumers should treat TrialStarted as
      independently meaningful (it carries plan + trial_ends_at), not as a
      strict successor to TenantCreated.

      Fan-out queue registry (LLD §7.3.2):
        Audit Log         tenant-audit-q          (all types)
        Notification      tenant-notification-q   TenantCreated, TrialStarted
        Realm Provisioner tenant-realm-q          TrialStarted only (trial_ends_at
                                                    for its own local expiry sweep)

      All queues: maxReceiveCount=5, standard (non-FIFO).

      Queue security: as for iam-membership-events, every subscribing SQS queue
      MUST enforce an aws:SourceArn ArnEquals condition on <SNS_TOPIC_TENANT_ARN>.
    messages:
      TenantCreated:
        $ref: '#/components/messages/TenantCreated'
      TrialStarted:
        $ref: '#/components/messages/TrialStarted'

  # ── SQS consumer queue channels (LLD §7.3.2 fan-out) ──────────────────────
  # These channels document the downstream SQS queues that receive events from
  # the two SNS topics. Each queue is owned by its consuming service; the
  # bindings below are informational for consumers onboarding to either topic.

  membershipAuditQueue:
    address: "membership-audit-q"
    servers:
      - $ref: '#/servers/sqsMembershipAudit'
    description: |
      SQS queue subscribed to all 12 membership event types. Audit Log
      archives every membership event for 7-year compliance retention
      (HLD §13.3).
      SNS subscription filter policy: (no filter)
    messages:
      DepartmentMembershipGranted:
        $ref: '#/components/messages/DepartmentMembershipGranted'
      DepartmentMembershipRevoked:
        $ref: '#/components/messages/DepartmentMembershipRevoked'
      DepartmentMembershipLevelChanged:
        $ref: '#/components/messages/DepartmentMembershipLevelChanged'
      TenantRoleGranted:
        $ref: '#/components/messages/TenantRoleGranted'
      TenantRoleRevoked:
        $ref: '#/components/messages/TenantRoleRevoked'
      MembershipRevoked:
        $ref: '#/components/messages/MembershipRevoked'
      TenderAssigneeOverridden:
        $ref: '#/components/messages/TenderAssigneeOverridden'
      TenantSeatOverageStarted:
        $ref: '#/components/messages/TenantSeatOverageStarted'
      TenantSeatOverageResolved:
