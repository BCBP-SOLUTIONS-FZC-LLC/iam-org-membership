      TenantRoleRevoked when the user no longer requires MFA per §6.5.
      SNS subscription filter policy:
        { "EventType": ["DepartmentMembershipGranted",
                        "DepartmentMembershipLevelChanged",
                        "TenantRoleGranted",
                        "TenantRoleRevoked"] }
    messages:
