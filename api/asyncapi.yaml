    TenantMembershipsPurged:
      name: TenantMembershipsPurged
      title: Tenant Memberships Purged
      summary: |
        Emitted by membership_event_consumer.go whenever a consumed
        tenant-lifecycle event genuinely transitions a tenant into
        offboarded. This is Core's own tenant-offboarding cascade signal,
        consumed by the Delegation, Tender-ACL, and Group-Mapping services
        to run their own async tenant-scoped cascade-deletes (their tables
