          properties:
            data:
              $ref: '#/components/schemas/TenantSuspendedPayload'

    TenantOffboardedEnvelope:
      allOf:
        - $ref: '#/components/schemas/ConsumedTenantLifecycleEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TenantOffboardedPayload'

    # DepartmentCatalogChangedEnvelope deliberately does NOT extend
    # ConsumedTenantLifecycleEnvelopeBase — that base's `type` enum and
    # required `tenant_id` are specific to the tenant-orgm-q/billing-orgm-q
    # consumed set (both queues project onto a single tenant's row); a
    # global department-catalog change is not inherently tenant-scoped, and
    # the real shape isn't defined yet (see DepartmentCatalogChanged
    # message summary) — this is a minimal, self-contained CloudEvents-
    # shaped envelope (§7.4) with only the fields catalog_consumer.go
    # actually reads (id, type), not a claim about fields it does not.
    DepartmentCatalogChangedEnvelope:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uuid
          description: RFC 4122 UUID v7 from the producer. Used as the processed_events idempotency key under consumer="catalog".
          example: "018f4c3e-a1b2-7000-9d3e-4f8c1a2b3d4e"
        type:
          type: string
          enum:
            - DepartmentCatalogChanged
        source:
          type: string
          description: Publishing-service identifier — expected "iam-catalog-admin" once the producer exists.
          example: "iam-catalog-admin"
        time:
          type: string
          format: date-time
          description: Not read by this consumer today (no ordering/staleness guard exists for this queue, unlike EVT-14/EVT-15 on tenant-orgm-q/billing-orgm-q).
          example: "2026-06-13T10:30:00Z"
        data:
          $ref: '#/components/schemas/DepartmentCatalogChangedPayload'

    TenantPlanChangedEnvelope:
      allOf:
        - $ref: '#/components/schemas/ConsumedTenantLifecycleEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TenantPlanChangedPayload'

    TenantPaymentPastDueEnvelope:
      allOf:
        - $ref: '#/components/schemas/ConsumedTenantLifecycleEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TenantPaymentPastDuePayload'

    TenantSubscriptionCancelledEnvelope:
      allOf:
        - $ref: '#/components/schemas/ConsumedTenantLifecycleEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TenantSubscriptionCancelledPayload'

    TenantReactivatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/ConsumedTenantLifecycleEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TenantReactivatedPayload'

    TenantSeatsChangedEnvelope:
      allOf:
        - $ref: '#/components/schemas/ConsumedTenantLifecycleEnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/TenantSeatsChangedPayload'

    # ── Consumed payload schemas (OPEN — producer-owned, not enforced here) ──
    # additionalProperties is deliberately left unset (open) throughout this
    # block: these shapes describe only the fields
    # membership_event_consumer.go actually unmarshals; the producing
    # service's own schema is free to carry additional fields this consumer
    # ignores.
    TrialTenantProvisionedPayload:
      type: object
      additionalProperties: true
      description: |
        No fields are read by this consumer — applyProjection's
        TrialTenantProvisioned case is a deliberate no-op (see the message
        summary above for why).

    TenantRealmReadyPayload:
      type: object
      additionalProperties: true
      properties:
        realm_id:
          type: string
          description: Keycloak realm identifier assigned to the tenant.
        realm_type:
          type: string
          description: e.g. "dedicated" — set together with realm_id and keycloak_shard in one UPDATE.
        keycloak_shard:
          type: string
          description: Identifies which Keycloak shard hosts this tenant's realm.

    TenantConvertedPayload:
      type: object
      additionalProperties: true
      properties:
        plan:
          type: string
          enum: [starter, pro, enterprise]
          description: |
            New plan code. If absent or empty, the previous plan is
            preserved rather than cleared.

    DirectPaidSignupPayload:
      type: object
      additionalProperties: true
      properties:
        plan:
          type: string
          enum: [starter, pro, enterprise]
          description: |
            New plan code. If absent or empty, the previous plan is
            preserved rather than cleared.

    TrialExpiredPayload:
      type: object
      additionalProperties: true
      description: No fields are read by this consumer — the projection is unconditional (status='trial_expired').

    TrialReactivatedPayload:
      type: object
      additionalProperties: true
      description: |
        No fields are read by this consumer. The new trial_ends_at is
        computed server-side from plans.trial_duration_days for the
        tenant's current plan, not taken from the payload.

    TenantSuspendedPayload:
      type: object
      additionalProperties: true
      required: [source]
      properties:
        source:
          type: string
          enum: [billing_lapse, operator]
          description: |
            Why the tenant is being suspended. Confirmed by RP (LLD §16
            OQ-7, resolved) — present on every TenantSuspended occurrence,
            never omitted in practice. 'billing_lapse' is the normal
            Billing-driven cancelled→suspended path, sent explicitly by
            RP's lapse sweep (RP-C3) — this service also stamps
            cancelled_at on that branch. 'operator' is an administrative
            suspension (Realm Provisioner RP-14, §8.12) that may apply
            directly from active/trial, skipping the grace path —
            cancelled_at is deliberately left untouched on this branch
            (LLD T-16). This service still defaults to 'billing_lapse' if
            the field is ever absent (defensive fallback only; RP does
            not rely on it).

    TenantOffboardedPayload:
      type: object
      additionalProperties: true
      description: No fields are read by this consumer — the projection is unconditional (status='offboarded', terminal).

    DepartmentCatalogChangedPayload:
      type: object
      additionalProperties: true
      description: |
        Deliberately open/undefined — iam-catalog-admin has not built the
        producer side of this event yet (tracked there as a deferred
        option, CAT-D3, not a committed contract; verified against its
        own source and .claude/api-and-events.md, not assumed). This
        service's consumer (catalog_consumer.go) does not decode any
        field of this payload — it only matches on the envelope's
        EventType and clears the om:departments cache — so no field list
        here would be more than a guess. Replace this schema with the
        real one once iam-catalog-admin defines and ships it; do not add
        speculative fields (department_id, change_type, etc.) without a
        confirmed contract from that service.

    TenantPlanChangedPayload:
      type: object
      additionalProperties: true
      properties:
        plan:
          type: string
          enum: [starter, pro, enterprise]
          description: |
            New plan code. If absent or empty, the previous plan is
            preserved rather than cleared. tenants.feature_flags is
            untouched (T-9).

    TenantPaymentPastDuePayload:
      type: object
      additionalProperties: true
      description: No fields are read by this consumer — the projection is unconditional (status='past_due').

    TenantSubscriptionCancelledPayload:
      type: object
      additionalProperties: true
      description: No fields are read by this consumer — the projection is unconditional (status='cancelled', cancelled_at set if not already).

    TenantReactivatedPayload:
      type: object
      additionalProperties: true
      description: |
        No fields are read by this consumer. The projection itself is
        guarded server-side: rejected as a no-op if the tenant is already
        offboarded (PAID-1).

    TenantSeatsChangedPayload:
      type: object
      additionalProperties: true
      required:
        - licensed_seats
      properties:
        licensed_seats:
          type: integer
          minimum: 0
          description: |
            New licensed seat count. Applied unconditionally (SEAT-2) —
            this consumer never rejects a TenantSeatsChanged regardless of
            current seat usage.
