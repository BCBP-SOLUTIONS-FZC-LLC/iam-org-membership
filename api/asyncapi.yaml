operations:
  publishMembershipEvents:
    action: send
    channel:
      $ref: '#/channels/iamMembershipEvents'
    tags:
      - $ref: '#/components/tags/published'
    summary: Publish membership lifecycle events (12 event types)
    description: |
      iam-org-membership publishes these 12 events atomically with the business
      write via the transactional outbox (same pgx.Tx). The outbox runner polls
      every 500 ms and delivers to the iam-membership-events SNS topic with
      at-least-once semantics — duplicate delivery is possible and consumers
      MUST be idempotent.

      RoutingPublisher (platform-events v1.3.0) selects this topic per message
      by inspecting Envelope.Source: values with the ".membership" suffix are
      routed here. See internal/adapter/outbound/eventbus/publisher.go.

      id is an RFC 4122 UUID v7 (time-ordered, 128-bit; monotonically ordered at
      publish time). It is the canonical idempotency key: consumers should record
      (id, consumer) in a unique index before committing side-effects and discard
      re-deliveries silently. This service's own SQS consumer uses the
      processed_events table for exactly this purpose (composite PK, 8-day
      retention per PE-1) — the same pattern is recommended for downstream
      consumers.

      Partial failure guidance:
        The hardest failure mode is a crash after side-effects are applied but
        before the idempotency record is persisted (or before the SQS delete
        succeeds). On redelivery the consumer sees a message it has already
        partially processed. Two safe patterns:

        a) Atomic commit (strongly preferred):
             Wrap side-effects AND the idempotency INSERT in a single database
             transaction. If either step fails the whole transaction rolls back —
             the side-effect is never partially applied. On redelivery, the INSERT
             succeeds and the side-effect is applied exactly once.

             Example (PostgreSQL):
               BEGIN;
               INSERT INTO processed_events (id, consumer) VALUES ($1, $2)
                 ON CONFLICT DO NOTHING RETURNING id;
               -- if the INSERT returned a row: apply side-effects here
               -- if it returned nothing: message already processed, skip
               COMMIT;

        b) Idempotent side-effects (when atomic commit is not possible):
             Design side-effects so that applying them twice produces the same
             result as applying them once (upsert instead of insert, set instead
             of increment, PUT instead of POST). Persist the idempotency record
             AFTER committing side-effects. On redelivery, re-applying an
             idempotent side-effect is safe; the record prevents any further
             re-processing once it is persisted.

        Anti-pattern to avoid: recording the idempotency key AFTER side-effects
        in a non-transactional way. A crash between the two steps leaves no record
        and the message will be re-delivered with the side-effect already applied.

      Note: monotonic id reflects publish order within this service but SNS
      does not preserve that order end-to-end — see channel description for the
      consumer-side ordering strategy.

      Clock skew caveat: UUID v7 embeds a millisecond-precision timestamp from
      the publishing node's system clock. In a multi-replica deployment (HPA 2-8),
      clock skew between nodes can cause slight ordering inversions — two events
      generated on different pods within the same millisecond window may arrive with
      ids that do not reflect true causal order. Same practical guidance applies
      as for iam-user-events (see the sibling service's spec).

      ── Retry & DLQ behavior ─────────────────────────────────────────────────
      Outbox → SNS:
        The platform-events outbox runner retries failed SNS publishes with
        exponential backoff (initial 1 s, doubles each attempt, capped at 5 min).
        Events that exhaust all retries are moved to the outbox_dead_letters table
        and increment the outbox_dead_letters_total Prometheus counter (labelled
        with the source topic). Alert on this counter per topic so dead-lettered
        events are investigated promptly.

      SNS → SQS subscriber:
        SNS delivers with at-least-once semantics to each subscribed SQS queue.
        SQS retries visibility-timeout-expired messages up to maxReceiveCount
        before routing to the queue's Dead Letter Queue. Recommended:
          visibilityTimeout : must exceed the consumer's max processing time
          maxReceiveCount   : 5 (gives 5 attempts before DLQ routing)
          DLQ alarm         : ApproximateNumberOfMessagesVisible > 0
        Consumers MUST configure a DLQ. Without one, poison-pill messages loop
        indefinitely and block healthy message processing on the same queue.

      Consumer timeout contract:
        Consumers MUST complete all processing (including side-effects and id
        persistence) within the configured visibilityTimeout. A message that
        is not deleted before the timeout expires becomes visible again and will
        be re-delivered — even if processing was in progress.

        Two strategies for long-running handlers:
          a) Heartbeat: call SQS ChangeMessageVisibility to extend the timeout
             while processing is still in progress. Extend by a fixed increment
             (e.g. 30 s) on a timer shorter than the remaining timeout window.
             Stop extending once side-effects are committed and the message is
             about to be deleted.
          b) Conservative timeout: set visibilityTimeout well above the p99
             processing time. Simpler, but wastes redelivery capacity if the
             consumer crashes after partial work.

        Recommended: use the heartbeat approach for any handler that calls
        external services (databases, HTTP APIs) where latency is unbounded.

      Poison message SOP (DLQ investigation before redrive):
        A message in a DLQ has failed maxReceiveCount delivery attempts. It MUST
        be inspected before redriving — blindly redriving a poison pill causes an
        infinite failure loop: source queue → DLQ → redrive → source queue → DLQ.

        Investigation checklist:
          1. Read the message body. Decode the 18-byte Glue header (if present) and
             unmarshal the envelope JSON. Note id, type, and trace_id.
          2. Correlate with traces: use trace_id in your distributed tracing system
             (Jaeger / X-Ray) to find the full request span and downstream spans.
             The producing handler span is identified by correlation_id.
          3. Check consumer logs for the event id. A transient error is safe to
             redrive after the root cause is fixed. A deterministic error will fail
             again — fix the consumer first.
          4. Check SQS ApproximateReceiveCount. If it equals maxReceiveCount, all
             retries were exhausted. Otherwise the message was moved manually.

        Redrive decision matrix:
          Transient failure → fix root cause, redrive via StartMessageMoveTask. Safe.
          Consumer bug → deploy the fix first, then redrive.
          Payload malformed / schema version unrecognised → do NOT redrive; file a bug.
          Unknown / cannot determine → do NOT redrive. Escalate.

        Fan-out note: SNS delivers a separate copy to each subscription. A message
        in one consumer's DLQ does not affect other consumers' queues — investigate
        and redrive per-queue, not globally.

      Fan-out note: SNS delivers a separate copy to each subscription. DLQ
      configuration is per SQS queue — each downstream team owns their own DLQ.
    messages:
      - $ref: '#/channels/iamMembershipEvents/messages/DepartmentMembershipGranted'
      - $ref: '#/channels/iamMembershipEvents/messages/DepartmentMembershipRevoked'
      - $ref: '#/channels/iamMembershipEvents/messages/DepartmentMembershipLevelChanged'
