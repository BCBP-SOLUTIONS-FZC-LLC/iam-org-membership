        type: boolean
      user_id:
        format: uuid
        type: string
    type: object
  http.InternalMembershipPatchRequest:
    properties:
      record_version:
        example: 1
        type: integer
      status:
        enum:
        - active
        - suspended
        type: string
    type: object
  http.InternalMembershipPatchResponse:
    properties:
      record_version:
