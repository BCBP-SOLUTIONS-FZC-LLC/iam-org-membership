        "429":
          description: reinvite_too_soon OR invite_rate_limited
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: P-6 — Invite user (staged pending_invitation)
      tags:
      - invitations
  /tenants/{id}/members/{user_id}:
    delete:
      description: Gated by delegate-impact pre-check (§8.8, WFI-1). Returns 409 workflow_resolution_required
        with active_workflows/workflow_ids/allowed_actions if the user is a delegate.
        TM-8 last-owner refusal returns 422 last_owner_removal. AUTH-8 best-effort
        session revoke.
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: User UUID
        format: uuid
        in: path
        name: user_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "409":
          description: workflow_resolution_required
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: last_owner_removal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: P-8 — Remove tenant member
      tags:
      - members
    get:
      description: Returns the tenant_memberships row joined with tenant_roles and
        dept_memberships views.
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: User UUID
        format: uuid
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.MemberItemResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: P-5 — Read a single member (with roles + departments)
      tags:
      - members
    patch:
      consumes:
      - application/json
      description: 'AUTH-2. On suspend: AUTH-8 best-effort RP RevokeUserSessions (fail-open).
        Applies optimistic locking (CONC-4).'
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: User UUID
        format: uuid
        in: path
        name: user_id
        required: true
        type: string
      - description: Status payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.MembershipPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.MembershipPatchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: record_version mismatch (CONC-4)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: P-7 — Suspend/reactivate member (status only)
      tags:
      - members
  /tenants/{id}/members/{user_id}/reset-mfa:
    post:
      description: Clears the target user's TOTP/WebAuthn credentials via the Realm
        Provisioner (RP-9); their next login forces re-enrollment. Fail-closed on
        RP outage (§16 OQ-8). Emits MFAReset for the Audit Log consumer.
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: User UUID
        format: uuid
        in: path
        name: user_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: member_not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: member_not_active
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: realm_provisioner_unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: P-34 — Reset a member's MFA
      tags:
      - members
  /tenants/{id}/members/{user_id}/roles:
    put:
      consumes:
      - application/json
      description: 'AUTH-2. §16 A14: one TenantRoleGranted/TenantRoleRevoked event
        per role delta. TM-8 last-owner guard → 422 last_owner_removal. `member` is
        barred (TR-7) — returns 400 invalid_role.'
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: User UUID
        format: uuid
        in: path
        name: user_id
        required: true
        type: string
      - description: Desired roles
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RolesPutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.RolesReconcileResponse'
        "400":
          description: invalid_role (TR-7)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: last_owner_removal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: P-28 — Full-replacement multi-role reconcile
      tags:
      - members
  /tenants/{id}/roles:
    get:
      description: Returns the tenant's customized display labels for the three department
        role levels.
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.RoleLabelListResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: P-12 — List dept-role labels (preparator/reviewer/approver)
      tags:
      - roles
  /tenants/{id}/roles/{role_code}:
    patch:
      consumes:
      - application/json
      description: AUTH-2. Applies optimistic locking (CONC-4). Only display_name
        is mutable; role_code is immutable.
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Role level
        enum:
        - preparator
        - reviewer
        - approver
        in: path
        name: role_code
        required: true
        type: string
      - description: Rename payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RoleLabelPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.RoleLabelResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: record_version mismatch (CONC-4)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: P-13 — Rename a dept-role label (display_name only)
      tags:
      - roles
  /tenants/{id}/seat-usage:
    get:
      description: AUTH-2. Returns `{active_users, pending_invitations, licensed_seats,
        over_cap, overage_since, grace_ends_at}` (SEAT-1..5).
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.SeatUsageResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: P-27 — Seat-usage projection
      tags:
      - members
  /tenants/{id}/users/{user_id}/removal-resolution:
    post:
      consumes:
      - application/json
      description: Reassigns or cancels workflows the target user is delegate on so
        P-8 can proceed (§8.8.3, WFI-6).
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: User UUID
        format: uuid
        in: path
        name: user_id
        required: true
        type: string
      - description: action + replacement
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.RemovalResolutionRequest'
      responses:
        "204":
          description: No Content
        "422":
          description: invalid_action | invalid_replacement
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: workflow_service_unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: P-26 — Resolve blocked user removal
      tags:
      - resolution
tags:
- description: In-mesh service-to-service (I-1..I-15)
  name: internal
- description: Platform operator (O-4, O-7 — O-1/O-2/O-3/O-5/O-6 retired ADR-0007 Wave 1, moved to iam-catalog-admin)
  name: operator
- description: Tenant CRUD (P-1, P-2)
  name: tenant
- description: Department activation (P-3, P-9, P-10, P-11, P-24, P-25)
  name: departments
- description: Membership management (P-4..P-8, P-27, P-28)
  name: members
- description: Dept-role labels (P-12, P-13)
  name: roles
- description: Two-step invite→accept (P-6, P-30, P-31)
  name: invitations
- description: Removal-resolution (P-26)
  name: resolution
- description: "Health & metrics (unauthenticated)"
  name: infra
securityDefinitions:
  TenantID:
    description: Tenant UUID injected by the API gateway. Establishes the RLS scope
      for the request (RLS-6).
    in: header
    name: x-tenant-id
    type: apiKey
  TenantRoles:
    description: Comma-separated tenant-role list injected by the API gateway. Operator
      routes require `platform_operator`; internal routes require `iam-system`.
    in: header
    name: x-tenant-roles
    type: apiKey
  UserID:
    description: Authenticated user UUID injected by the API gateway. Use `iam-system`
      for in-mesh service calls hitting `/api/v1/internal/*`.
    in: header
    name: x-user-id
    type: apiKey
swagger: "2.0"
