basePath: /api/v1
definitions:
  domain.DeptRole:
    enum:
    - preparator
    - reviewer
    - approver
    type: string
    x-enum-varnames:
    - DeptPreparator
    - DeptReviewer
    - DeptApprover
  domain.InvitationDeptMapping:
    properties:
      department_id:
        type: string
      level:
        $ref: '#/definitions/domain.DeptRole'
    type: object
  domain.RealmType:
    enum:
    - shared
    - dedicated
    type: string
    x-enum-varnames:
    - RealmShared
    - RealmDedicated
  domain.SubscriptionStatus:
    enum:
    - trial
    - active
    - past_due
    - cancelled
    - suspended
    - trial_expired
    - offboarded
    type: string
    x-enum-varnames:
    - StatusTrial
    - StatusActive
    - StatusPastDue
    - StatusCancelled
    - StatusSuspended
    - StatusTrialExpired
    - StatusOffboarded
  domain.TenantPlan:
    enum:
    - starter
    - pro
    - enterprise
    type: string
    x-enum-varnames:
    - PlanStarter
    - PlanPro
    - PlanEnterprise
  http.AssigneeOverrideRequest:
    properties:
      actor_id:
        format: uuid
        type: string
      department_id:
        format: uuid
        type: string
      new_user_id:
        format: uuid
        type: string
      required_level:
        enum:
        - preparator
        - reviewer
        - approver
        type: string
    type: object
  http.AssigneeOverrideResponse:
    properties:
      eligible:
        example: true
        type: boolean
      tenant_id:
        format: uuid
        type: string
      tender_id:
        format: uuid
        type: string
      user_id:
        format: uuid
        type: string
    type: object
  http.DepartmentListResponse:
    properties:
      items:
        description: Items is the collection of active departments for the tenant.
        items:
          $ref: '#/definitions/http.DepartmentResponse'
        type: array
    type: object
  http.DepartmentResponse:
    properties:
      code:
        type: string
      department_id:
        type: string
      is_active:
        type: boolean
      is_system:
        type: boolean
      name:
        type: string
      record_version:
        type: integer
    type: object
  http.DeptMemberListItem:
    properties:
      level:
        enum:
        - preparator
        - reviewer
        - approver
        type: string
      user_id:
        format: uuid
        type: string
    type: object
  http.DeptMemberListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/http.DeptMemberListItem'
        type: array
    type: object
  http.DeptMemberView:
    properties:
      department_id:
        type: string
      level:
        type: string
    type: object
  http.DeptMembershipAssignResponse:
    properties:
      department_id:
        format: uuid
        type: string
      level:
        enum:
        - preparator
        - reviewer
        - approver
        type: string
      record_version:
        example: 1
        type: integer
      user_id:
        format: uuid
        type: string
    type: object
  http.DeptMembershipPutRequest:
    properties:
      level:
        type: string
    type: object
  http.DeptMembershipRemoveResponse:
    properties:
      department_id:
        format: uuid
        type: string
      removed:
        example: true
        type: boolean
      user_id:
        format: uuid
        type: string
    type: object
  http.ErrorResponse:
    properties:
      active_workflows:
        description: |-
          ActiveWorkflows is populated on 409 workflow_resolution_required
          responses (§8.8). Count of open workflows blocking the mutation.
        example: 3
        type: integer
      allowed_actions:
        description: AllowedActions lists the P-26 resolution actions the caller may
          invoke.
        example:
        - replace_delegate
        - stop_workflows
        items:
          type: string
        type: array
      code:
        description: Code is a legacy alias for Error kept for backwards compatibility.
        example: not_found
        type: string
      details:
        description: Details is populated with per-field errors for 422 validation
          failures.
        items:
          $ref: '#/definitions/http.ValidationError'
        type: array
      error:
        description: Error is the machine-readable error code (LLD §17 error taxonomy).
        example: not_found
        type: string
      message:
        description: Message is a human-readable explanation of the error.
        example: resource not found
        type: string
      record_version:
        description: |-
          RecordVersion is populated on 409 optimistic_lock_conflict responses
          so the client can re-read and retry (CONC-4).
        example: 5
        type: integer
      request_id:
        description: RequestID is the per-request UUID injected by platform-gincommon.
        example: 01H8XYZ0000000000000000000
        type: string
      status:
        description: Status is the HTTP status code echoed in the body.
        example: 404
        type: integer
      trace_id:
        description: TraceID is the OTel W3C trace ID for cross-service correlation.
        example: a3f1b2c8d4e5f60718293a4b5c6d7e8f
        type: string
      workflow_ids:
        description: WorkflowIDs is populated on 409 workflow_resolution_required
          responses.
        items:
          type: string
        type: array
    type: object
  http.InternalAddMemberRequest:
    properties:
      email:
        example: user@example.com
        type: string
      keycloak_user_id:
        format: uuid
        type: string
      user_id:
