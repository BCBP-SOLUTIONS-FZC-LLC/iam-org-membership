  http.InternalProvisionRequest:
    properties:
      default_locale:
        description: DefaultLocale is an optional BCP-47 locale (e.g. "en-US").
        example: en-US
        type: string
      name:
        description: Name is the display name.
        example: Acme Corp
        type: string
      owner_user_id:
