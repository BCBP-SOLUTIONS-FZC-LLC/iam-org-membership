    type: object
  http.MembershipPatchRequest:
    properties:
      record_version:
        type: integer
      status:
        type: string
    type: object
  http.MembershipPatchResponse:
    properties:
      record_version:
        example: 2
        type: integer
      status:
        enum:
        - active
        - suspended
        type: string
      updated_at:
        format: date-time
        type: string
      user_id:
        format: uuid
        type: string
    type: object
  http.OperatorFeatureFlagsRequest:
    properties:
      feature_flags:
        additionalProperties: {}
        type: object
      record_version:
        description: |-
          RecordVersion is the current tenants.record_version obtained from
          GET /api/v1/tenants/:id — required optimistic-lock contract per LLD
          O-4 (§4.5, CONC-1). WHERE record_version = $N mismatch → 409.
        type: integer
