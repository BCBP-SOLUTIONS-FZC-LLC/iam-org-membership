        example: mfa_freshness_seconds
        type: string
      message:
        description: Message is a human-readable explanation of the field violation.
        example: must be between 60 and 900
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: sharmila.dayalan@bcbpsolutions.com
    name: BCBP Solutions
  description: |-
    Organizational layer of the IAM subsystem — owns tenants, departments, memberships, tenant-level roles, and invitations.

    **Tenant isolation.** Every resource is scoped by `x-tenant-id`; cross-tenant reads are blocked by row-level security (RLS-1..RLS-6). The hot path `GET /internal/users/:id/memberships` is the enrichment source for AuthZ (SLO 15 ms cache-hit / 30 ms cache-miss).

    **Route prefixes.**  `/api/v1/*` — authenticated tenant users (JWT via gateway).  `/api/v1/internal/*` — in-mesh services (mTLS, `iam-system` role).  `/api/v1/operator/*` — platform operators (`platform_operator` role).

    Every mutation echoes `record_version` for optimistic-locking round-trip (CONC-4).
  license:
    name: Proprietary
  title: IAM Org & Membership API
  version: "1.0"
paths:
  /healthz:
    get:
      description: Always returns ok if the process can answer HTTP at all. Never
        inspects dependencies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - infra
  /internal/subscription-lapses:
    get:
      description: Returns tenants with status='cancelled' whose cancelled_at is older
        than SUBSCRIPTION_GRACE_DAYS. Self-idempotent — RP suspending a tenant removes
        it from the next poll.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.SubscriptionLapseListResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: List tenants past their subscription-cancellation grace period (RP-C3
        subscription-lapse sweep)
      tags:
      - internal
  /internal/tenants:
    post:
      consumes:
      - application/json
      description: Activates the 5 default system departments, creates 3 dept-role
        labels, grants tenant_owner, and emits TenantCreated + TrialStarted in one
        transaction. Called directly by the Signup BFF / Realm Provisioner over the
        internal mesh — every tenant is created trial-shaped regardless of plan; a
        consumed TrialTenantProvisioned event, if received, is an idempotent no-op
        reconcile, not a trigger for this handler.
      parameters:
      - description: Provisioning payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.InternalProvisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Idempotent replay (LLD I1-1: same id already provisioned)'
          schema:
            $ref: '#/definitions/http.TenantResponse'
        "201":
          description: Fresh create
          schema:
            $ref: '#/definitions/http.TenantResponse'
        "400":
          description: validation_error (missing/malformed required fields)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: insufficient_role (non iam-system caller)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: slug_already_taken (LLD I1-2)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: invalid_plan (plan not in {starter,pro,enterprise})
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: I-1 — Provision tenant (trial signup)
      tags:
      - internal
  /internal/tenants/{id}:
    patch:
      consumes:
      - application/json
      description: Called by Realm Provisioner after Keycloak realm creation. Sets
        the tenant's realm identity in a single UPDATE. All three fields (realm_id,
        realm_type, keycloak_shard) are required per LLD §5.4 I-2.
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Realm identity payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.InternalRealmPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.InternalTenantRealmResponse'
        "400":
          description: validation_error (missing required field)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: insufficient_role (non iam-system caller)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: tenant_not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: invalid_realm_type (realm_type not in {shared, dedicated})
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: I-2 — RP sets realm_id + realm_type + keycloak_shard atomically
      tags:
      - internal
  /internal/tenants/{id}/dept-memberships:
    post:
      consumes:
      - application/json
      description: §8.5 JIT dept + tenant-role assignment. Called by the Event Consumer
        on Keycloak login for federated (SAML) users. Additive only — never revokes
        a role a group set no longer implies. Emits DepartmentMembershipGranted /
        DepartmentMembershipLevelChanged per resolved (dept, role_level) touch per
        TRG-3.
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: JIT payload — user_id + Keycloak group list
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.InternalJITRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.InternalJITResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: I-10 — SAML JIT provisioning (additive-only, GTRM-4)
      tags:
      - internal
  /internal/tenants/{id}/locale:
    get:
      description: Returns the tenant's default_locale for LLM-facing consumers.
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.InternalLocaleResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
      - TenantRoles: []
      summary: I-9 — Tenant default_locale (LLM Service)
      tags:
      - internal
  /internal/tenants/{id}/members:
    post:
      consumes:
      - application/json
      description: §8.10 acceptance leg. If a matching pending_invitations row exists
        (by keycloak_user_id or email), flip to accepted and materialise tenant_membership
        + queued initial_tenant_roles/initial_dept_mappings in one tx (PI-4). Otherwise
        plain add. PI-10 idempotent via uq_tm_active_user.
      parameters:
      - description: Tenant UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Register payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.InternalAddMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.MembershipItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - UserID: []
      - TenantID: []
