      full_name:
        type: string
      id:
        description: |-
          LLD §5.4 P-6 spec key is `invitation_id`. `id` is the legacy alias,
          carried for one release so downstream clients can migrate; will be
          removed once tooling ships the rev-1.51-compat build.
        type: string
      invitation_id:
        type: string
      record_version:
        type: integer
      status:
        type: string
