# LocalStack Pro override — enables Glue Schema Registry and KMS on top of the
# community-edition base stack (docker-compose.yml).
#
# Requires a valid LOCALSTACK_AUTH_TOKEN in .env (see .env-example).
#
#   make docker-up-pro
#   # equivalent to:
#   docker compose -f docker-compose.yml -f docker-compose.pro.yml up -d \
#                  postgres pgbouncer redis localstack
#
# With Pro:
#   - Glue Schema Registry: set GLUE_REGISTRY_NAME in .env to activate the
#     ValidatingCodec / GlueCodec chain. MUST stay empty while PG_BOUNCER_MODE=true
#     — Glue's 18-byte binary header is not valid JSONB and corrupts
#     outbox_events.payload under transaction pooling (see .env-example).
#   - KMS: available for future S3-KMS use (this service does not use S3 today).
#   - SNS + SQS: identical to community edition.
services:
  localstack:
    image: localstack/localstack-pro:latest
    environment:
      SERVICES: sns,sqs,glue,kms
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
    volumes:
      # Mount the event-schema workspace so schema-gov / Glue init hooks can
      # read the schemas colocated with the eventbus adapter.
      - ./internal/adapter/outbound/eventbus/schemas:/etc/localstack/init/schemas:ro

  app:
    environment:
      GLUE_REGISTRY_NAME: ${GLUE_REGISTRY_NAME:-}
      GLUE_REGISTRY_ARN: ${GLUE_REGISTRY_ARN:-}
