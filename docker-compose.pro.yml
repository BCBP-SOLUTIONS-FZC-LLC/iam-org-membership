# LocalStack Pro override — enables Glue Schema Registry and KMS on top of the
# community-edition base stack (docker-compose.yml).
#
# Requires a valid LOCALSTACK_AUTH_TOKEN in .env (see .env-example).
#
#   make docker-up-pro
#   # equivalent to:
#   docker compose -f docker-compose.yml -f docker-compose.pro.yml up -d \
#                  postgres pgbouncer redis localstack
#
# With Pro:
#   - Glue Schema Registry: set GLUE_REGISTRY_MEMBERSHIP_NAME /
#     GLUE_REGISTRY_TENANT_NAME in .env to activate the GlueCodec on each
#     topic (one registry per topic, SCHEMA-7). The codec runs at
#     SNS-publish time only — outbox_events always stores plain JSON, so
#     this is safe to combine with PG_BOUNCER_MODE=true (see .env-example).
#   - KMS: available for future S3-KMS use (this service does not use S3 today).
#   - SNS + SQS: identical to community edition.
services:
  localstack:
    image: localstack/localstack-pro:latest
    environment:
      SERVICES: sns,sqs,glue,kms
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
    volumes:
      # Mount the event-schema workspace so schema-gov / Glue init hooks can
      # read the schemas colocated with the eventbus adapter.
      - ./internal/adapter/outbound/eventbus/schemas:/etc/localstack/init/schemas:ro

  app:
    environment:
      GLUE_REGISTRY_MEMBERSHIP_NAME: ${GLUE_REGISTRY_MEMBERSHIP_NAME:-}
      GLUE_REGISTRY_MEMBERSHIP_ARN: ${GLUE_REGISTRY_MEMBERSHIP_ARN:-}
      GLUE_REGISTRY_TENANT_NAME: ${GLUE_REGISTRY_TENANT_NAME:-}
      GLUE_REGISTRY_TENANT_ARN: ${GLUE_REGISTRY_TENANT_ARN:-}
